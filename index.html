                Object.entries(counts).forEach(([id, count]) => {
                    if (count <= 0) return;
                    const v = FOCACCIA_VARIANTS[id];
                    lines.push(`\n${v.emoji} ${v.name} × ${count}`);
                    v.ingredients.forEach(ing => {
                        const total = ing.g * count;
                        const u = ing.unit === 'hojas' ? ' hojas' : 'g';
                        const w = ing.when === 'after' ? ' [al salir del horno]' : ing.when === 'split' ? ' [antes y al salir]' : '';
                        lines.push(`  ${ing.name}: ${round(ing.g, 1)}${u}/bandeja × ${count} = ${round(total, 1)}${u}${w}`);
                    });
                });
                lines.push('\n═══════════════════════════════════════');
                lines.push('LISTA DE LA COMPRA');
                lines.push('═══════════════════════════════════════');
                FOCACCIA_TOPPING_ORDER.forEach(id => {
                    const d = shoppingList[id];
                    if (!d || d.total <= 0) return;
                    const info = FOCACCIA_TOPPING_INFO[id];
                    const val = d.unit === 'hojas' ? `~${Math.round(d.total)} hojas` : `${round(d.total, 1)}g`;
                    lines.push(`• ${info.label}: ${val}${info.note ? '  (' + info.note + ')' : ''}`);
                });
                return lines.join('\n');
            };

            const copyAll = () => navigator.clipboard?.writeText(buildText()).then(() => showToast('Lista copiada ✓'));

                const blob = new Blob([buildText()], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `focaccia-toppings-${totalAssigned}b.txt`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Lista descargada ✓');
            };

            return (
                <div className="animate-in">
                    {view === 'assign' && (
                    <>
                    <div style={{
                        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                        marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem',

                        {Object.entries(FOCACCIA_VARIANTS).map(([id, v]) => {

                                                color: isAtLimit ? 'var(--text-muted)' : 'var(--text)',

                            <div style={{fontFamily: 'var(--font-label)', fontSize: '0.95rem', fontWeight: 500, color: 'var(--accent)', marginBottom: '0.6rem'}}>

                            </div>
                            <div style={{display: 'flex', flexDirection: 'column', gap: '0.85rem', marginBottom: '1.5rem'}}>

                                    const v = FOCACCIA_VARIANTS[id];
                                    return (
                                        <div key={id} className="phase-card" style={{marginBottom: 0, padding: '0.85rem 1rem'}}>

                                                <div style={{fontWeight: 600, fontSize: '0.92rem', color: 'var(--text)'}}>{v.emoji} {v.name}</div>
                                                <span style={{fontSize: '0.72rem', color: 'var(--text-soft)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700, background: 'var(--surface-2)', padding: '0.15rem 0.55rem', borderRadius: '999px'}}>× {count}</span>
                                            </div>
                                            <table className="recipe-table" style={{marginBottom: 0}}>

                                                        <th>Ingrediente</th>

                        {isOverLimit && (

                                <br/><strong>Verduras acuosas</strong> (cherry, calabacín): ponlas boca arriba y sin amontonar, o soltarán agua sobre la masa.
                            </div>
                        </>

                    </>
                    )}

        };

        // ============================================================
        // GOFRES RESULTS COMPONENT
        // ============================================================
        const GofresResults = ({ units, coldHours, readyTime, setReadyTime, checks, onToggleCheck, onResetChecks, showToast }) => {
            const [activeTab, setActiveTab] = useState('recipe');
            const recipe = useMemo(() => scaleGofres(units), [units]);

            // Build schedule (working backwards from ready time)
            const schedule = useMemo(() => {
                const [bh, bm] = readyTime.split(':').map(Number);
                const ready = new Date();
                ready.setHours(bh, bm, 0, 0);
                if (ready < new Date()) ready.setDate(ready.getDate() + 1);

                // Cooking takes ~3-5 min per waffle batch; assume 4 per batch on average
                const batchesNeeded = Math.ceil(units / 4);
                const cookingTime = batchesNeeded * 4 / 60; // hours

                const events = [];
                events.push({ time: new Date(ready), name: 'Listos para servir', desc: 'Cómelos tibios, recién caramelizados', icon: '🧇', kind: 'normal' });
                events.push({ time: addHours(ready, -0.03), name: 'Reposo final', desc: '2 min sobre rejilla — el caramelo endurece', icon: '⏳', kind: 'normal', dur: 0.03 });
                events.push({ time: addHours(ready, -0.03 - cookingTime), name: 'Cocción en gofrera', desc: `${batchesNeeded} ${batchesNeeded === 1 ? 'tanda' : 'tandas'} de 3-5 min`, icon: '🔥', kind: 'bake', dur: cookingTime });
                events.push({ time: addHours(ready, -0.5 - 0.03 - cookingTime), name: 'Última fermentación + precalentar gofrera', desc: '30 min · bolas hinchadas y blandas al tacto', icon: '🥯', kind: 'normal', dur: 0.5 });
                events.push({ time: addHours(ready, -0.58 - 0.03 - cookingTime), name: 'Formar las bolas', desc: `${units} bolas de ~${GOFRE_WEIGHT}g`, icon: '🤲', kind: 'normal', dur: 0.08 });
                events.push({ time: addHours(ready, -0.83 - 0.03 - cookingTime), name: 'Incorporar azúcar perlado + reposo', desc: 'Plegar suave sin amasar · 15 min reposo', icon: '✨', kind: 'normal', dur: 0.25 });

        // ============================================================
        // FOCACCIA RESULTS COMPONENT
        // ============================================================
        const FocacciaResults = ({ starterType, trays, ambientTemp, coldHours, bakeTime, setBakeTime, checks, onToggleCheck, onResetChecks, toppings, setToppings, showToast }) => {
            const [activeTab, setActiveTab] = useState('recipe');

            // Auto-select thermal mode based on temperature
            const thermalMode = ambientTemp >= 26 ? 'calor' : 'normal';
            const base = FOCACCIA_BASE[thermalMode][starterType];
            const totalWeight = trays * FOCACCIA_TRAY.doughPerTray;
            const recipe = useMemo(() => scaleFocaccia(base, totalWeight), [base, totalWeight]);

            // Calculate effective hydration (counting starter contribution)
            // Masa madre is 100% hydration → half flour, half water
            // Fresh yeast contributes negligibly
            const effFlour = starterType === 'masa_madre'
                ? recipe.flour + recipe.starter / 2
                : recipe.flour;
            const effWater = starterType === 'masa_madre'
                ? recipe.water + recipe.starter / 2
                : recipe.water;
            const effHydration = (effWater / effFlour) * 100;

            const levado1Hours = base.levado1;

            // Build schedule (working backwards from bake time)
            const schedule = useMemo(() => {
                const [bh, bm] = bakeTime.split(':').map(Number);
                const bake = new Date();
                bake.setHours(bh, bm, 0, 0);
                if (bake < new Date()) bake.setDate(bake.getDate() + 1);

                // Offsets (in hours, working backwards from bake)
                const t_temper      = 1.1;                              // 1h atempering + 0.1 (~6 min) for shaping
                const t_cold_end    = t_temper + coldHours;             // end of fridge = start of atempering
                const t_rest        = t_cold_end + 0.5;                 // 30 min covered rest after folds
                const t_bulk_end    = t_rest;                            // bulk ends at rest start
                const t_bulk_start  = t_bulk_end + levado1Hours;
                const t_knead       = t_bulk_start + 0.1;                // ~6 min mixing

                const events = [];
                events.push({ time: new Date(bake.getTime() + 30 * 60000), name: 'Cortar y servir', desc: 'La miga ya ha asentado', icon: '🍽️', kind: 'normal' });
                events.push({ time: new Date(bake), name: 'Hornear', desc: '220°C con vapor · 30 min', icon: '🔥', kind: 'bake' });
                events.push({ time: addHours(bake, -0.05), name: 'Aliñar y hoyitos', desc: 'Aceite, sal, romero · presionar con dedos', icon: '👇', kind: 'normal' });
                events.push({ time: addHours(bake, -t_temper), name: 'Sacar de nevera y extender', desc: 'Atempera 1h · vuelca en bandeja sin amasar', icon: '☀️', kind: 'normal', dur: 1 });
                events.push({ time: addHours(bake, -t_cold_end), name: `A la nevera (${formatHours(coldHours)})`, desc: 'Tapado, fría a 4°C · desarrolla sabor', icon: '❄️', kind: 'cold', dur: coldHours });
                events.push({ time: addHours(bake, -t_rest), name: 'Reposo tapado', desc: '30 min a temperatura ambiente', icon: '⏱️', kind: 'normal', dur: 0.5 });
                events.push({ time: addHours(bake, -t_bulk_start), name: 'Bulk + pliegues', desc: `Levado ${formatHours(levado1Hours)} a ${ambientTemp}°C, después 4 pliegues`, icon: '🥣', kind: 'normal', dur: levado1Hours });
                events.push({ time: addHours(bake, -t_knead), name: 'Empezar amasado', desc: 'Mezcla agua+fermento, harina, sal y aceite al final', icon: '👐', kind: 'start' });
                return events.reverse();
            }, [bakeTime, levado1Hours, ambientTemp, coldHours]);

            const buildText = () => {
                const lines = [];
                lines.push(`FOCACCIA — ${trays} ${trays === 1 ? 'bandeja' : 'bandejas'} (${FOCACCIA_TRAY.label}, ${FOCACCIA_TRAY.dimensions})`);

                lines.push('═══════════════════════════════════════');
                if (thermalMode === 'calor') lines.push('Modo: temperatura ambiente alta (>26°C)');
                lines.push('\nINGREDIENTES:');
                lines.push(`  Harina de fuerza: ${round(recipe.flour, 1)}g`);
                lines.push(`  ${starterType === 'masa_madre' ? 'Masa madre activa' : 'Levadura fresca'}: ${round(recipe.starter, 1)}g`);
                lines.push(`  Agua: ${round(recipe.water, 1)}g`);
                lines.push(`  Sal: ${round(recipe.salt, 1)}g`);
                lines.push(`\nHidratación efectiva: ${round(effHydration, 1)}%`);
                lines.push('\nPROCESO:');
                FOCACCIA_PROCESS.forEach(p => {
                    const desc = p.dynamic ? `${formatHours(levado1Hours)} a ${ambientTemp}°C`
                              : p.dynamicCold ? `${formatHours(coldHours)} en nevera tapado. La masa desarrolla sabor y estructura.`
                              : p.desc;
                    lines.push(`  ${p.step}. ${p.name}: ${desc}`);
                });
                lines.push('\nHORNEADO: 220°C con poco vapor · 30 min');
                lines.push('Reposo final: 30 min antes de cortar');
                return lines.join('\n');
            };

            const copyAll = () => {
                navigator.clipboard?.writeText(buildText()).then(() => showToast('Receta copiada ✓'));
            };
            const downloadAll = () => {
                const blob = new Blob([buildText()], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `focaccia-${trays}b-${Math.round(totalWeight)}g.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Receta descargada ✓');
            };

            return (
                <div>
                    <div className="tabs">
                        <button className={`tab ${activeTab === 'recipe' ? 'active' : ''}`} onClick={() => setActiveTab('recipe')}>📋 Receta</button>

                        <button className={`tab ${activeTab === 'baking' ? 'active' : ''}`} onClick={() => setActiveTab('baking')}>🔥 Horneado</button>
                        <button className={`tab ${activeTab === 'checklist' ? 'active' : ''}`} onClick={() => setActiveTab('checklist')}>✓ Checklist</button>
                    </div>

                    {/* Thermal mode indicator */}
                    {thermalMode === 'calor' && (
                        <div className="warn-box" style={{marginBottom: '1rem'}}>
                            <Icon name="alert" />
                            <span><strong>Modo calor activado</strong> ({ambientTemp}°C ≥ 26°C). Receta ajustada con menos fermento y bulk más corto para evitar sobrefermentación.</span>
                        </div>
                    )}

                    {/* RECIPE TAB */}
                    {activeTab === 'recipe' && (
                        <div className="animate-in">
                            <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem'}}>
                                <div style={{fontSize: '0.83rem', color: 'var(--text-soft)'}}>
                                    <strong style={{color: 'var(--text)'}}>{trays} {trays === 1 ? 'bandeja' : 'bandejas'}</strong> · {Math.round(totalWeight)}g masa · {starterType === 'masa_madre' ? '🌾 Masa madre' : '🍞 Levadura fresca'}

                                    <button className="icon-btn" onClick={copyAll}><Icon name="copy" size={14}/> Copiar</button>
                                    <button className="icon-btn" onClick={downloadAll}><Icon name="download" size={14}/></button>
                                </div>
                            </div>

                            <div className="ing-grid">
                                <div className="ing-card">
                                    <div className="l">Harina de fuerza</div>
                                    <div className="v">{round(recipe.flour, 0)}</div>
                                    <div className="u">gramos</div>
                                </div>
                                <div className="ing-card">
                                    <div className="l">{starterType === 'masa_madre' ? 'Masa madre' : 'Levadura fresca'}</div>
                                    <div className="v">{round(recipe.starter, starterType === 'masa_madre' ? 0 : 1)}</div>
                                    <div className="u">gramos</div>
                                </div>
                                <div className="ing-card">
                                    <div className="l">Agua</div>
                                    <div className="v">{round(recipe.water, 0)}</div>
                                    <div className="u">gramos</div>

                });
                lines.push(`  Total: ${round(impasto1Total, 0)}g`);
                lines.push('  Fermentación: 25-26°C · 12-14h · debe TRIPLICAR · pH ideal 5.2-5.4');

                lines.push(`\n━━━ FASE 4 · SEGUNDO IMPASTO (${dayName(0).toUpperCase()} MAÑANA) ━━━`);
                impasto2.forEach(i => {
                    lines.push(`  ${i.name}: ${round(i.g, 1)}g${i.note ? ' (' + i.note + ')' : ''}`);
                });
                lines.push(`  Total añadido: ${round(impasto2Total, 0)}g`);
                lines.push('  Temperatura ideal: 24-26°C · test de membrana translúcida');

                lines.push('\n━━━ FASE 6 · HORNEADO ━━━');
                lines.push(`  Temperatura: ${moldData.bakeTemp}°C`);
                lines.push(`  Tiempo: ${moldData.bakeMin}-${moldData.bakeMax} min`);
                lines.push('  Sonda interna: 92°C');
                lines.push('  VOLTEO INMEDIATO al salir · Enfriar 12h boca abajo');

                return lines.join('\n');
            };

            const copyAll = () => {
                navigator.clipboard?.writeText(buildText()).then(() => showToast('Receta copiada ✓'));

            const downloadAll = () => {
                const blob = new Blob([buildText()], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `panettone-${mold}-x${units}.txt`;

            // Checklist items
            const allChecks = [
                { id: 'prep_naranja',   day: dayName(-3),  text: 'Naranja confitada hecha y secando en rejilla' },

                                            </div>
                                        </details>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RECIPE TAB */}
                    {activeTab === 'recipe' && (
                        <div className="animate-in">
                            <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem'}}>
                                <div style={{fontSize: '0.83rem', color: 'var(--text-soft)'}}>
                                    Para <strong style={{color: 'var(--text)'}}>{units}</strong> {units === 1 ? 'molde' : 'moldes'} de <strong style={{color: 'var(--text)'}}>{moldData.label}</strong>

                                <div style={{display: 'flex', gap: '0.4rem'}}>
                                    <button className="icon-btn" onClick={copyAll}><Icon name="copy" size={14}/> Copiar</button>

                            {/* Impasto 1 */}
                            <div style={{fontFamily: 'var(--font-label)', fontSize: '1rem', fontWeight: 500, marginBottom: '0.5rem', color: 'var(--accent)'}}>
                                🍳 Primer impasto <span style={{fontSize: '0.78rem', color: 'var(--text-soft)', fontWeight: 400, fontFamily: 'var(--font-ui)'}}>· sábado noche</span>
                            </div>
                            <table className="recipe-table">
                                <thead>

                            <div style={{fontFamily: 'var(--font-label)', fontSize: '1rem', fontWeight: 500, marginBottom: '0.5rem', marginTop: '1rem', color: 'var(--accent)'}}>

                    {/* CHECKLIST TAB */}
                    {activeTab === 'checklist' && (

                    {/* BAKING TAB */}
                    {activeTab === 'baking' && (
                        <div className="animate-in">
                            <div className="bake-card">
                                <div className="bake-header">🔥 Horneado · {moldData.label}</div>
                                <div className="bake-preheat">
                                    <span>Precalentamiento</span>
                                    <span><span className="pt">{moldData.bakeTemp}°C</span> · sin vapor · calor estático</span>
                                </div>
                                <div className="bake-note">⚠️ El chocolate hace que la cúpula se oscurezca antes que en el clásico.</div>
                                <div className="bake-phase">
                                    <div className="bake-phase-title">Cocción</div>
                                    <div className="bake-stats">
                                        <div className="bake-stat"><div className="v">{moldData.bakeTemp}°C</div><div className="l">Temp.</div></div>
                                        <div className="bake-stat"><div className="v">{moldData.bakeMin}-{moldData.bakeMax} min</div><div className="l">Tiempo</div></div>
                                        <div className="bake-stat"><div className="v">92°C</div><div className="l">Sonda</div></div>
                                    </div>
                                    <div className="bake-action">
                                        Hornea sin vapor con calor estático. Cubre la cúpula con aluminio si se dora demasiado ({mold.startsWith('900') ? 'a los 25-30 min' : 'a los 30 min'} aprox.). Sonda interna 92°C indica cocción correcta.
                                    </div>
                                </div>
                                <div className="bake-note">❄️ <strong>Volteo inmediato</strong> al salir del horno. Pinchos cruzados, boca abajo, mínimo 12h sin mover.</div>
                            </div>

                            <div style={{marginTop: '1rem'}}>
                                <div style={{fontFamily: 'var(--font-label)', fontSize: '0.95rem', fontWeight: 500, marginBottom: '0.6rem', color: 'var(--accent)'}}>
                                    📐 Datos del molde
                                </div>
                                <table className="recipe-table">
                                    <tbody>
                                        <tr><td>Tipo</td><td className="qty">{moldData.label}</td></tr>
                                        <tr><td>Ø base</td><td className="qty">{moldData.diameter} cm</td></tr>
                                        <tr><td>Altura</td><td className="qty">{moldData.height} cm</td></tr>
                                        <tr><td>Carga (crudo)</td><td className="qty">{moldData.loadCrudo}g</td></tr>
                                        <tr><td>Capacidad final</td><td className="qty">{moldData.capacity}g</td></tr>
                                    </tbody>
                                </table>
                                <div className="info-note" style={{marginTop: '0.6rem', fontSize: '0.76rem'}}>
                                    {moldData.note}. Cargar siempre un 15% más del peso nominal del molde.
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // MAIN APP
        // ============================================================
        // Default values for reset
        const DEFAULTS = {
            doughType: 'pan', flour: 500, pizzaBalls: 4,
            hydration: 70, saltPercent: 2, totalTime: 4,
            temperature: 22, useColdProof: false, coldProofTime: 18,
            prefermentType: 'none', prefermentFlourPercent: 30,
            prefermentTime: 14, prefermentTemp: 20,
        };

        // Load saved state from localStorage
        const loadSaved = () => {
            try {
                const saved = localStorage.getItem('fermCalcState');
                return saved ? { ...DEFAULTS, ...JSON.parse(saved) } : DEFAULTS;
            } catch (e) { return DEFAULTS; }
        };

        const App = () => {
            const [theme, setTheme] = useState(() => {
                if (typeof localStorage !== 'undefined') {
                    return localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                }
                return 'light';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                if (typeof localStorage !== 'undefined') localStorage.setItem('theme', theme);
            }, [theme]);


            const initial = loadSaved();
            const [doughType, setDoughType]                   = useState(initial.doughType);
            const [flour, setFlour]                           = useState(initial.flour);
            const [pizzaBalls, setPizzaBalls]                 = useState(initial.pizzaBalls);
            const [pizzaOven, setPizzaOven] = useState(() => {
                try { return localStorage.getItem('pizzaOven') || 'ooni'; } catch(e) { return 'ooni'; }
            });
            const [pizzaFlour, setPizzaFlour] = useState(() => {
                try { return localStorage.getItem('pizzaFlour') || 'nuvola'; } catch(e) { return 'nuvola'; }
            });
            const [pizzaHyd, setPizzaHyd] = useState(() => {
                try { return parseFloat(localStorage.getItem('pizzaHyd')) || 68; } catch(e) { return 68; }
            });

            const [useMalt, setUseMalt] = useState(() => {
                try { return localStorage.getItem('useMalt') === 'true'; } catch(e) { return false; }
            });
            const [maltPercent, setMaltPercent] = useState(() => {
                try { return parseFloat(localStorage.getItem('maltPercent')) || 0.3; } catch(e) { return 0.3; }
            });

            const [pizzaFreeze, setPizzaFreeze] = useState(() => {
                try { return localStorage.getItem('pizzaFreeze') === 'true'; } catch(e) { return false; }
            });
            const [pizzaThawRoute, setPizzaThawRoute] = useState(() => {
                try { return localStorage.getItem('pizzaThawRoute') || 'nevera'; } catch(e) { return 'nevera'; }
            });
            const [hydration, setHydration]                   = useState(initial.hydration);
            const [saltPercent, setSaltPercent]               = useState(initial.saltPercent);
            const [totalTime, setTotalTime]                   = useState(initial.totalTime);
            const [temperature, setTemperature]               = useState(initial.temperature);
            const [useColdProof, setUseColdProof]             = useState(initial.useColdProof);
            const [coldProofTime, setColdProofTime]           = useState(initial.coldProofTime);
            const [prefermentType, setPrefermentType]         = useState(initial.prefermentType);
            const [prefermentFlourPercent, setPrefermentFlourPercent] = useState(initial.prefermentFlourPercent);
            const [prefermentTime, setPrefermentTime]         = useState(initial.prefermentTime);
            const [prefermentTemp, setPrefermentTemp]         = useState(initial.prefermentTemp);
            const [activePreset, setActivePreset]             = useState(null);
            const [activeTab, setActiveTab]                   = useState('recipe');
            const [toast, setToast]                           = useState(null);
            const [presetModified, setPresetModified]         = useState(false);
            const [bakeTime, setBakeTime] = useState(() => {
                const t = new Date(); t.setHours(18, 0, 0, 0);
                return t.toTimeString().slice(0, 5);
            });

            // Panettone state
            const [panMold, setPanMold]         = useState(() => {
                try { return localStorage.getItem('panMold') || '500_alto'; } catch(e) { return '500_alto'; }
            });
            const [panUnits, setPanUnits]       = useState(() => {
                try { return parseInt(localStorage.getItem('panUnits')) || 2; } catch(e) { return 2; }
            });
            const [panLiquidStarter, setPanLiquidStarter] = useState(() => {
                try { return localStorage.getItem('panLiquidStarter') === 'true'; } catch(e) { return false; }
            });
            const [panChecks, setPanChecks]     = useState(() => {
                try { return JSON.parse(localStorage.getItem('panChecks') || '{}'); } catch(e) { return {}; }
            });
            const [panBakeDay, setPanBakeDay]   = useState(() => {
                try { return localStorage.getItem('panBakeDay') || 'sunday'; } catch(e) { return 'sunday'; }
            });

            // Focaccia state
            const [focStarter, setFocStarter]   = useState(() => {
                try { return localStorage.getItem('focStarter') || 'masa_madre'; } catch(e) { return 'masa_madre'; }
            });
            const [focTrays, setFocTrays]       = useState(() => {
                try {
                    // Migrate from old focWeight if present
                    const oldWeight = parseInt(localStorage.getItem('focWeight'));
                    if (oldWeight && !localStorage.getItem('focTrays')) {
                        return Math.max(1, Math.round(oldWeight / FOCACCIA_TRAY.doughPerTray));
                    }
                    return parseInt(localStorage.getItem('focTrays')) || 1;
                } catch(e) { return 1; }
            });
            const [focAmbient, setFocAmbient]   = useState(() => {
                try { return parseInt(localStorage.getItem('focAmbient')) || 22; } catch(e) { return 22; }
            });
            const [focColdHours, setFocColdHours] = useState(() => {
                try { return parseInt(localStorage.getItem('focColdHours')) || 24; } catch(e) { return 24; }
            });
            const [focBakeTime, setFocBakeTime] = useState(() => {
                try { return localStorage.getItem('focBakeTime') || '13:00'; } catch(e) { return '13:00'; }
            });

            const [focToppings, setFocToppings] = useState(() => {
                try {
                    const saved = localStorage.getItem('focToppings');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return { clasica: 1, patata_romero: 0, cebolla_gorgonzola: 0, cherry_ajo: 0, anchoas_alcaparras: 0, higos_stracciatella: 0 };
            });

            const [focChecks, setFocChecks] = useState(() => {
                try { return JSON.parse(localStorage.getItem('focChecks') || '{}'); } catch(e) { return {}; }
            });
            const toggleFocCheck = (id) => setFocChecks(prev => ({ ...prev, [id]: !prev[id] }));

            // Gofres state
            const [gofUnits, setGofUnits]         = useState(() => {
                try { return parseInt(localStorage.getItem('gofUnits')) || 13; } catch(e) { return 13; }
            });
            const [gofColdHours, setGofColdHours] = useState(() => {
                try { return parseFloat(localStorage.getItem('gofColdHours')) || 4; } catch(e) { return 4; }
            });
            const [gofReadyTime, setGofReadyTime] = useState(() => {
                try { return localStorage.getItem('gofReadyTime') || '17:30'; } catch(e) { return '17:30'; }
            });

            const [gofChecks, setGofChecks] = useState(() => {
                try { return JSON.parse(localStorage.getItem('gofChecks') || '{}'); } catch(e) { return {}; }
            });
            const toggleGofCheck = (id) => setGofChecks(prev => ({ ...prev, [id]: !prev[id] }));

            // Pizza topping counts (per variant)
            const [pizzaToppingCounts, setPizzaToppingCounts] = useState(() => {
                try {
                    const saved = localStorage.getItem('pizzaToppingCounts');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                // Default: 3 marghe, 2 diavola, 2 speck_gorgonzola, 2 pollo_maiz, 1 marinara, 1 quattro, 1 bianca, 0 capricciosa
                return {
                    margherita: 3, marinara: 1, diavola: 2,
                    speck_gorgonzola: 2, quattro_formaggi: 1,
                    pollo_maiz: 2, bianca_speck: 1, capricciosa: 0,
                    cacio_pepe: 0,
                };
            });

            useEffect(() => {
                try {
                    localStorage.setItem('panMold', panMold);
                    localStorage.setItem('panUnits', String(panUnits));
                    localStorage.setItem('panLiquidStarter', String(panLiquidStarter));
                    localStorage.setItem('panChecks', JSON.stringify(panChecks));
                    localStorage.setItem('panBakeDay', panBakeDay);
                    localStorage.setItem('focStarter', focStarter);
                    localStorage.setItem('focTrays', String(focTrays));
                    localStorage.setItem('focAmbient', String(focAmbient));
                    localStorage.setItem('focColdHours', String(focColdHours));
                    localStorage.setItem('focBakeTime', focBakeTime);
                    localStorage.setItem('gofUnits', String(gofUnits));
                    localStorage.setItem('gofColdHours', String(gofColdHours));
                    localStorage.setItem('gofReadyTime', gofReadyTime);
                    localStorage.setItem('pizzaToppingCounts', JSON.stringify(pizzaToppingCounts));
                    localStorage.setItem('pizzaOven', pizzaOven);
                    localStorage.setItem('pizzaFlour', pizzaFlour);
                    localStorage.setItem('pizzaHyd', String(pizzaHyd));
                    localStorage.setItem('useMalt', String(useMalt));
                    localStorage.setItem('maltPercent', String(maltPercent));
                    localStorage.setItem('pizzaFreeze', String(pizzaFreeze));
                    localStorage.setItem('pizzaThawRoute', pizzaThawRoute);
                    localStorage.setItem('focChecks', JSON.stringify(focChecks));
                    localStorage.setItem('focToppings', JSON.stringify(focToppings));
                    localStorage.setItem('gofChecks', JSON.stringify(gofChecks));
                } catch(e) {}
            }, [panMold, panUnits, panLiquidStarter, panChecks, panBakeDay, focStarter, focTrays, focAmbient, focColdHours, focBakeTime, gofUnits, gofColdHours, gofReadyTime, pizzaToppingCounts, pizzaOven, focChecks, gofChecks, focToppings, pizzaFreeze, pizzaThawRoute, useMalt, maltPercent, pizzaFlour, pizzaHyd]);

            const togglePanCheck = (id) => {
                setPanChecks(prev => ({ ...prev, [id]: !prev[id] }));
            };

            // Show toast helper
            const showToast = useCallback((msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2200);
            }, []);

            // Con levadura comercial el máximo razonable de frío es 48h
            useEffect(() => {
                if (focStarter === 'levadura' && focColdHours > 48) setFocColdHours(48);
            }, [focStarter, focColdHours]);

            // ── Wake Lock: mantener la pantalla encendida mientras cocinas ──
            // wakeWanted = intención del usuario (persiste aunque el sistema
            // libere el bloqueo al minimizar). wakeRef = bloqueo real activo.
            const wakeSupported = typeof navigator !== 'undefined' && 'wakeLock' in navigator;
            const [wakeWanted, setWakeWanted] = useState(false);
            const wakeRef = React.useRef(null);

            const acquireWake = useCallback(async () => {
                if (!wakeSupported) return false;
                try {
                    const lock = await navigator.wakeLock.request('screen');
                    wakeRef.current = lock;
                    lock.addEventListener('release', () => { wakeRef.current = null; });
                    return true;
                } catch (e) {
                    wakeRef.current = null;
                    return false;
                }
            }, [wakeSupported]);

            const toggleWake = useCallback(async () => {
                if (!wakeSupported) {
                    showToast('Tu navegador no permite mantener la pantalla encendida');
                    return;
                }
                if (wakeWanted) {
                    try { await wakeRef.current?.release(); } catch (e) {}
                    wakeRef.current = null;
                    setWakeWanted(false);
                    showToast('Pantalla liberada');
                } else {
                    const ok = await acquireWake();
                    if (ok) {
                        setWakeWanted(true);
                        showToast('Pantalla siempre encendida ☕');
                    } else {
                        showToast('No se pudo activar el bloqueo de pantalla');
                    }
                }
            }, [wakeWanted, wakeSupported, acquireWake, showToast]);

            // El sistema libera el bloqueo al minimizar o cambiar de pestaña:
            // lo recuperamos al volver si el usuario lo dejó activado.
            useEffect(() => {
                if (!wakeSupported) return;
                const onVisible = () => {
                    if (wakeWanted && document.visibilityState === 'visible' && !wakeRef.current) {
                        acquireWake();
                    }
                };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, [wakeWanted, wakeSupported, acquireWake]);

            // Persist state to localStorage
            useEffect(() => {
                try {
                    localStorage.setItem('fermCalcState', JSON.stringify({
                        doughType, flour, pizzaBalls, hydration, saltPercent, totalTime,
                        temperature, useColdProof, coldProofTime, prefermentType,
                        prefermentFlourPercent, prefermentTime, prefermentTemp
                    }));
                } catch (e) {}
            }, [doughType, flour, pizzaBalls, hydration, saltPercent, totalTime, temperature, useColdProof, coldProofTime, prefermentType, prefermentFlourPercent, prefermentTime, prefermentTemp]);

            // Reset to defaults
            const resetAll = () => {
                if (!window.confirm('¿Restablecer todos los parámetros a los valores por defecto?')) return;
                Object.entries(DEFAULTS).forEach(([k, v]) => {
                    const setter = {
                        doughType: setDoughType, flour: setFlour, pizzaBalls: setPizzaBalls,
                        hydration: setHydration, saltPercent: setSaltPercent, totalTime: setTotalTime,
                        temperature: setTemperature, useColdProof: setUseColdProof,
                        coldProofTime: setColdProofTime, prefermentType: setPrefermentType,
                        prefermentFlourPercent: setPrefermentFlourPercent,
                        prefermentTime: setPrefermentTime, prefermentTemp: setPrefermentTemp
                    }[k];
                    if (setter) setter(v);
                });
                setActivePreset(null);
                setPresetModified(false);
                showToast('Valores restablecidos');
            };

            const DOUGHBALL_WEIGHT = 260;
            // AVPN standard values — not exposed as sliders for pizza
            const PIZZA_SALT = 2.8;

            const applyPreset = useCallback((preset) => {
                const c = preset.config;
                if (c.doughType !== undefined) setDoughType(c.doughType);
                if (c.flour !== undefined) setFlour(c.flour);
                if (c.pizzaBalls !== undefined) setPizzaBalls(c.pizzaBalls);
                if (c.hydration !== undefined) setHydration(c.hydration);
                if (c.saltPercent !== undefined) setSaltPercent(c.saltPercent);
                if (c.totalTime !== undefined) setTotalTime(c.totalTime);
                if (c.temperature !== undefined) setTemperature(c.temperature);
                setUseColdProof(c.useColdProof || false);
                if (c.coldProofTime !== undefined) setColdProofTime(c.coldProofTime);
                setPrefermentType(c.prefermentType || 'none');
                if (c.prefermentFlourPercent !== undefined) setPrefermentFlourPercent(c.prefermentFlourPercent);
                if (c.prefermentTime !== undefined) setPrefermentTime(c.prefermentTime);
                if (c.prefermentTemp !== undefined) setPrefermentTemp(c.prefermentTemp);
                setTimeout(() => {
                    setActivePreset(preset.id);
                    setPresetModified(false);
                }, 0);
                showToast(`Aplicado: ${preset.name}`);
            }, [showToast]);

            useEffect(() => {
                if (activePreset) {
                    // Check if current state matches the preset
                    const preset = PRESETS.find(p => p.id === activePreset);
                    if (preset) {
                        const c = preset.config;
                        const matches =
                            (c.doughType === undefined || c.doughType === doughType) &&
                            (c.flour === undefined || c.flour === flour) &&
                            (c.pizzaBalls === undefined || c.pizzaBalls === pizzaBalls) &&
                            (c.hydration === undefined || c.hydration === hydration) &&
                            (c.saltPercent === undefined || c.saltPercent === saltPercent) &&
                            (c.totalTime === undefined || c.totalTime === totalTime) &&
                            (c.temperature === undefined || c.temperature === temperature) &&
                            ((c.useColdProof || false) === useColdProof) &&
                            (c.coldProofTime === undefined || c.coldProofTime === coldProofTime) &&
                            ((c.prefermentType || 'none') === prefermentType) &&
                            (c.prefermentFlourPercent === undefined || c.prefermentFlourPercent === prefermentFlourPercent) &&
                            (c.prefermentTime === undefined || c.prefermentTime === prefermentTime) &&
                            (c.prefermentTemp === undefined || c.prefermentTemp === prefermentTemp);
                        setPresetModified(!matches);
                    }
                }
            // eslint-disable-next-line
            }, [flour, pizzaBalls, hydration, saltPercent, totalTime, temperature, useColdProof, coldProofTime, prefermentType, prefermentFlourPercent, prefermentTime, prefermentTemp, doughType, pizzaOven]);


            // ─── COMPUTATION ─────────────────────────────────────────
            const calc = useMemo(() => {
                // En pizza la hidratación viene del selector de harina; la sal sigue fija (AVPN)
                const effHydration = doughType === 'pizza' ? pizzaHyd : hydration;
                const effSalt      = doughType === 'pizza' ? PIZZA_SALT      : saltPercent;

                const currentFlour = doughType === 'pan'
                    ? flour
                    : (pizzaBalls * DOUGHBALL_WEIGHT) / ((100 + effHydration + effSalt) / 100);

                const usePref = prefermentType !== 'none';
                const cfg = PREFERMENTS[prefermentType];
                let prefFlour = 0, prefWater = 0, prefYeast = 0;
                let finalFlour = currentFlour;
                let finalWater = currentFlour * (effHydration / 100);

                if (usePref) {
                    prefFlour = currentFlour * (prefermentFlourPercent / 100);
                    prefWater = prefFlour * (cfg.hydration / 100);
                    finalFlour = currentFlour - prefFlour;
                    finalWater = currentFlour * (effHydration / 100) - prefWater;

                    if (!cfg.noYeast && prefermentTime > 0) {
                        let pYP = yeastForTime(prefermentTime, prefermentTemp);
                        pYP = clamp(pYP, 0.02, 1);
                        prefYeast = prefFlour * (pYP / 100);
                    }
                }

                let yeastPercent = 0, ambientH = 0, coldH = 0;
                if (useColdProof) {
                    ambientH = clamp(1.5 / rateFactor(temperature), 0.5, 3);
                    coldH = coldProofTime;
                    yeastPercent = yeastForBulk(ambientH, coldH, temperature);
                } else {
                    ambientH = totalTime;
                    yeastPercent = yeastForTime(totalTime, temperature);
                }
                yeastPercent = clamp(yeastPercent, 0.01, 5);

                if (usePref && !cfg.noYeast) {
                    const prefContribution = (prefermentFlourPercent / 100) * 0.5;
                    yeastPercent = yeastPercent * (1 - prefContribution);
                    yeastPercent = clamp(yeastPercent, 0.01, 5);
                }
                if (usePref && cfg.noYeast) yeastPercent = 0;

                const yeastGrams = finalFlour * (yeastPercent / 100);
                const saltGrams = currentFlour * (effSalt / 100);

                const temperingTime = useColdProof
                    ? (currentFlour <= 750 ? 1.5 : currentFlour <= 1500 ? 2.5 : 3.5) / rateFactor(temperature)
                    : 0;

                const finalProofTime = (1.5 / rateFactor(temperature)) * (useColdProof ? 1.2 : 1);

                const bakingPlan = (() => {
                    if (doughType === 'pizza') {
                        if (pizzaOven === 'ooni') return {
                            preheat: {
                                temp: '430-450°C en la piedra',
                                time: '20-30 min a llama máxima',
                                notes: 'No basta con que la piedra marque 430°C: el techo tiene que estar incandescente. Mide también la cúpula (~500°C). El cornicione sube por el calor radiante de arriba, no por el suelo.'
                            },
                            phases: [
                                {
                                    name: 'Entrada y asentado',
                                    temp: 'Llama al máximo', time: '0-30 s', mode: 'Sin tocar',
                                    action: 'Introduce la pizza dejando el borde exterior a unos 2 cm de la boca. NO bajes la llama: si la bajas, la cúpula se enfría y pierdes el cornicione. Los primeros 20-30 s déjala quieta para que la base agarre.'
                                },
                                {
                                    name: 'Giros',
                                    temp: 'Llama al máximo', time: '30-60 s', mode: 'Pala perforada',
                                    action: 'Gira 90° cada 15-20 s con la pala. No la lleves hacia el fondo al girar: el fondo es para recuperar la piedra entre pizzas, no para cocinar. Si un lado se te dora demasiado rápido, gira antes.'
                                },
                                {
                                    name: 'Doming (leoparding)',
                                    temp: 'Llama al máximo', time: '15-20 s finales', mode: 'Pizza elevada',
                                    action: 'Cuando la base ya esté hecha, levanta la pizza con la pala 5-15 cm hacia el techo. Ese golpe de calor radiante es lo que hincha el cornicione y crea las manchas oscuras. Si el borde se te quema, baja la altura del doming antes que bajar la llama.'
                                }
                            ],
                            cooling: 'Fuera a los 60-90 s totales. Si tardas más, el precalentamiento se quedó corto. Aceite EVOO en crudo al salir y a la mesa.'
                        };

                        if (pizzaOven === 'acero') return {
                            preheat: {
                                temp: '250-300°C (máxima)',
                                time: '45-60 min con el acero dentro',
                                notes: 'El acero conduce mucho más calor que la piedra. Colócalo en la parte alta del horno, a 15-20 cm del grill.'
                            },
                            phases: [
                                {
                                    name: 'Base sobre el acero',
                                    temp: 'Máxima', time: '3-4 min', mode: 'Calor arriba/abajo',
                                    action: 'Pizza directa sobre el acero ardiendo. El acero hace la base rápido mientras el resto se cocina.'
                                },
                                {
                                    name: 'Grill para el cornicione',
                                    temp: 'Grill al máximo', time: '1-2 min', mode: 'Solo grill',
                                    action: 'Enciende el grill los últimos minutos. Es la única forma de conseguir algo de leoparding en un horno doméstico. Vigila sin separarte: pasa de dorado a quemado en segundos.'
                                }
                            ],
                            cooling: 'Servir al instante. Aceite EVOO en crudo al salir.'
                        };

                        return {
                            preheat: {
                                temp: '250°C (máxima)',
                                time: '45-60 min con la piedra o bandeja dentro',
                                notes: 'Sin acero el calor sube más despacio. Precalienta la superficie de cocción desde el principio; nunca metas la pizza en una bandeja fría.'
                            },
                            phases: [
                                {
                                    name: 'Cocción',
                                    temp: '250°C', time: '7-10 min', mode: 'Calor abajo + ventilador si tienes',
                                    action: 'Coloca la pizza en la parte baja los primeros minutos para hacer la base, y súbela después. Con estas temperaturas la masa se seca más, así que no te pases de tiempo.'
                                },
                                {
                                    name: 'Golpe de grill',
                                    temp: 'Grill', time: '1-2 min', mode: 'Solo grill arriba',
                                    action: 'Grill al final para dar color al cornicione y fundir bien el queso. Sin este paso la pizza queda pálida.'
                                }
                            ],
                            cooling: 'Servir al instante. Con horno doméstico no esperes leoparding: busca una pizza bien cocida y sabrosa, no la estética napolitana.'
                        };
                    }

                    const tf = 1 + ((currentFlour - 500) / 500) * 0.25;

                    if (prefermentType === 'esponja') return {
                        preheat: { temp: '180°C', time: '20 min', notes: 'Temperatura moderada porque las grasas y azúcares aceleran el dorado.' },
                        phases: [{
                            name: 'Horneado completo',
                            temp: '180°C', time: `${Math.round(35 * tf)}-${Math.round(45 * tf)} min`, mode: 'Calor arriba/abajo',
                            action: 'Hornea hasta dorado profundo. Si se dora demasiado por arriba, cubre con papel de aluminio los últimos 10-15 minutos. Tester: 92-95°C de temperatura interna.'
                        }],
                        cooling: 'Enfría completamente sobre rejilla (mínimo 1h) antes de cortar para que la miga asiente.'
                    };

                    const high = hydration > 78;
                    return {
                        preheat: { temp: high ? '250°C' : '240°C', time: '45-60 min', notes: 'Crítico: precalienta con la dutch oven o piedra dentro para acumular calor.' },
                        phases: [
                            {
                                name: 'Salto y expansión (con vapor)',
                                temp: high ? '250°C' : '240°C',
                                time: high ? `${Math.round(20 * tf)}-${Math.round(22 * tf)} min` : `${Math.round(15 * tf)}-${Math.round(20 * tf)} min`,
                                mode: 'Calor arriba/abajo',
                                action: 'Hornea tapado en la dutch oven (o crea vapor con bandeja de hielo). El vapor mantiene la corteza elástica para que el pan rompa por las greñas y suba al máximo.'
                            },
                            {
                                name: 'Corteza y color',
                                temp: high ? '230°C' : '210°C',
                                time: high ? `${Math.round(18 * tf)}-${Math.round(22 * tf)} min` : `${Math.round(20 * tf)}-${Math.round(25 * tf)} min`,
                                mode: 'Calor arriba/abajo',
                                action: 'Destapa o retira la fuente de vapor. La corteza se oscurece y crujifica. Busca un caoba profundo. Temp. interna 96-99°C.'
                            }
                        ],
                        cooling: 'Esencial: mínimo 2h sobre rejilla antes de cortar. La miga sigue cocinándose con el vapor interno y el sabor termina de desarrollarse.'
                    };
                })();

                const totalDough = currentFlour + (currentFlour * effHydration / 100) + saltGrams + yeastGrams + prefYeast;

                return {
                    currentFlour, finalFlour, finalWater, prefFlour, prefWater, prefYeast,
                    yeastPercent, yeastGrams, saltGrams,
                    ambientH, coldH, temperingTime, finalProofTime,
                    bakingPlan, totalDough,
                    effHydration, effSalt,
                };
            }, [doughType, flour, pizzaBalls, hydration, saltPercent, totalTime, temperature, useColdProof, coldProofTime, prefermentType, prefermentFlourPercent, prefermentTime, prefermentTemp, pizzaHyd]);

            const quality = useQualityCheck({ doughType, hydration, saltPercent, temperature, totalTime, useColdProof, coldProofTime, prefermentType, prefermentTemp });

            // Difficulty score (1-5)
            const difficulty = useMemo(() => {
                let score = 1;
                if (hydration > 75) score++;
                if (hydration > 85) score++;
                if (useColdProof) score++;
                if (prefermentType !== 'none') score++;
                if (prefermentType === 'masa_madre') score++;
                if (doughType === 'pizza') score++;
                return clamp(score, 1, 5);
            }, [hydration, useColdProof, prefermentType, doughType]);
            const difficultyLabel = ['', 'Principiante', 'Fácil', 'Intermedio', 'Avanzado', 'Experto'][difficulty];

            // ─── SCHEDULE ────────────────────────────────────────────
            const schedule = useMemo(() => {
                const [bh, bm] = bakeTime.split(':').map(Number);
                const bake = new Date();
                bake.setHours(bh, bm, 0, 0);
                if (bake < new Date()) bake.setDate(bake.getDate() + 1);

                const events = [];
                events.push({ time: new Date(bake), name: 'Hornear', desc: 'El pan entra al horno precalentado', icon: '🔥', kind: 'bake' });

                let cursor = new Date(bake);

                const frozen = doughType === 'pizza' && pizzaFreeze;
                if (frozen) {
                    // Día de horneado: sacar del congelador y descongelar
                    const plan = thawPlan(pizzaThawRoute, temperature);
                    [...plan.steps].reverse().forEach(st => {
                        cursor = addHours(cursor, -st.h);
                        events.push({
                            time: new Date(cursor), name: st.name, desc: st.desc,
                            icon: st.icon, kind: st.temp === '4°C' ? 'cold' : 'normal', dur: st.h
                        });
                    });
                    events.push({
                        time: new Date(cursor), name: '🧊 Sacar del congelador',
                        desc: 'Aquí empieza el día de horneado. Todo lo anterior lo hiciste el día que preparaste la masa.',
                        icon: '🧊', kind: 'start'
                    });
                }

                // Final proof
                cursor = addHours(cursor, -calc.finalProofTime);
                events.push({ time: new Date(cursor), name: frozen ? 'Levado final antes de congelar' : 'Levado final', desc: doughType === 'pizza' ? 'Bolea las pizzas y deja reposar' : 'En banneton o molde, hasta ~70% de aumento', icon: '🫓', kind: 'normal', dur: calc.finalProofTime });

                if (frozen) {
                    events.push({
                        time: new Date(cursor), name: 'Al congelador',
                        desc: 'Bolas en tuppers individuales o bolsas untadas de aceite. Aguantan hasta 3 meses.',
                        icon: '🧊', kind: 'cold'
                    });
                }

                // Bench rest before final proof (only for pan, not pizza)
                if (doughType === 'pan') {
                    const benchRest = 0.4; // ~25 min
                    cursor = addHours(cursor, -benchRest);
                    events.push({ time: new Date(cursor), name: 'Boleado y reposo', desc: 'Preforma, deja relajar 20-30 min, luego forma definitiva', icon: '🤲', kind: 'normal', dur: benchRest });
                }

                if (useColdProof) {
                    if (calc.temperingTime > 0) {
                        cursor = addHours(cursor, -calc.temperingTime);
                        events.push({ time: new Date(cursor), name: 'Atemperar', desc: 'Saca de la nevera, deja que pierda el frío', icon: '☀️', kind: 'normal', dur: calc.temperingTime });
                    }
                    cursor = addHours(cursor, -calc.coldH);
                    events.push({ time: new Date(cursor), name: 'A la nevera', desc: `Retardo en frío a ${FRIDGE_TEMP}°C — desarrolla sabor`, icon: '❄️', kind: 'cold', dur: calc.coldH });

                    // Folds during bulk if hydration is high
                    if (hydration >= 70 && calc.ambientH >= 1) {
                        const foldsCount = hydration >= 80 ? 4 : 3;
                        cursor = addHours(cursor, -calc.ambientH);
                        events.push({ time: new Date(cursor), name: 'Mezcla + bulk con pliegues', desc: `${foldsCount} pliegues cada 30 min durante la fermentación a ${temperature}°C`, icon: '🥣', kind: 'normal', dur: calc.ambientH });
                    } else {
                        cursor = addHours(cursor, -calc.ambientH);
                        events.push({ time: new Date(cursor), name: 'Mezcla y bulk corto', desc: `Fermentación a ${temperature}°C antes del frío`, icon: '🥣', kind: 'normal', dur: calc.ambientH });
                    }
                } else {
                    // Folds during bulk if hydration is high
                    if (hydration >= 70 && calc.ambientH >= 2) {
                        const foldsCount = hydration >= 80 ? 4 : 3;
                        cursor = addHours(cursor, -calc.ambientH);
                        events.push({ time: new Date(cursor), name: 'Bulk con pliegues', desc: `${foldsCount} pliegues cada ${Math.round(calc.ambientH * 60 / (foldsCount + 1))} min a ${temperature}°C`, icon: '🥣', kind: 'normal', dur: calc.ambientH });
                    } else {
                        cursor = addHours(cursor, -calc.ambientH);
                        events.push({ time: new Date(cursor), name: 'Bulk principal', desc: `Fermentación en bloque a ${temperature}°C`, icon: '🥣', kind: 'normal', dur: calc.ambientH });
                    }
                }

                // Autolisis only suggested for high hydration breads
                if (doughType === 'pan' && hydration >= 75) {
                    const autolyse = 0.5;
                    cursor = addHours(cursor, -autolyse);
                    events.push({ time: new Date(cursor), name: 'Autólisis', desc: 'Mezcla harina + agua, deja reposar 30 min antes de añadir sal y levadura', icon: '💧', kind: 'normal', dur: autolyse });
                }

                events.push({ time: new Date(cursor), name: 'Empezar aquí', desc: (prefermentType !== 'none' ? 'Mezcla la masa final con el prefermento ya activo' : 'Pesa los ingredientes y comienza') + (useMalt ? '. Mezcla la malta en seco con la harina, nunca en el agua con la levadura' : ''), icon: '👐', kind: 'start' });

                if (prefermentType !== 'none') {
                    cursor = addHours(cursor, -prefermentTime);
                    const desc = PREFERMENTS[prefermentType].noYeast
                        ? `${prefermentTime}h a ${prefermentTemp}°C — refresca tu masa madre`
                        : `${prefermentTime}h a ${prefermentTemp}°C en bote tapado`;
                    events.push({ time: new Date(cursor), name: `Preparar ${PREFERMENTS[prefermentType].name}`, desc, icon: '🌿', kind: 'normal', dur: prefermentTime });
                }

                return events.reverse();
            }, [bakeTime, calc, useColdProof, temperature, prefermentType, prefermentTime, prefermentTemp, doughType, hydration, pizzaFreeze, pizzaThawRoute, useMalt]);

            // ─── RECIPE TEXT ─────────────────────────────────────────
            const recipeText = useMemo(() => {
                const lines = [];
                lines.push(`RECETA — ${doughType === 'pizza' ? 'Pizza' : 'Pan'}${prefermentType !== 'none' ? ' con ' + PREFERMENTS[prefermentType].name : ''}`);
                lines.push('═══════════════════════════');
                if (prefermentType !== 'none') {
                    lines.push(`\n${PREFERMENTS[prefermentType].name} (${prefermentTime}h a ${prefermentTemp}°C):`);
                    lines.push(`  Harina: ${round(calc.prefFlour)}g`);
                    lines.push(`  Agua: ${round(calc.prefWater)}g`);
                    if (calc.prefYeast > 0) lines.push(`  Levadura seca: ${round(calc.prefYeast, 2)}g`);
                    if (PREFERMENTS[prefermentType].noYeast) lines.push(`  Masa madre activa: ${round(calc.prefFlour * 0.4)}g aprox`);
                }
                lines.push(`\nMasa final:`);
                lines.push(`  Harina: ${round(calc.finalFlour)}g`);
                lines.push(`  Agua: ${round(calc.finalWater)}g`);
                lines.push(`  Sal: ${round(calc.saltGrams, 1)}g`);
                if (useMalt) lines.push(`  Malta diastásica: ${round(calc.currentFlour * maltPercent / 100, 1)}g (${maltPercent}%) — mezclar en seco con la harina`);
                if (calc.yeastGrams > 0) lines.push(`  Levadura seca: ${round(calc.yeastGrams, 2)}g`);
                lines.push(`\nTotales: ${round(calc.currentFlour)}g harina · ${calc.effHydration}% hidratación · ${calc.effSalt}% sal`);
                if (doughType === 'pizza') lines.push(`Harina: ${PIZZA_FLOURS[pizzaFlour].label} (${PIZZA_FLOURS[pizzaFlour].sub}) · rango recomendado ${PIZZA_FLOURS[pizzaFlour].hydLo}-${PIZZA_FLOURS[pizzaFlour].hydHi}%`);
                lines.push(`\nFermentación:`);
                if (useColdProof) {
                    lines.push(`  • Bulk corto: ${formatHours(calc.ambientH)} a ${temperature}°C`);
                    lines.push(`  • Frío: ${formatHours(calc.coldH)} a ${FRIDGE_TEMP}°C`);
                    if (calc.temperingTime > 0) lines.push(`  • Atemperar: ${formatHours(calc.temperingTime)}`);
                } else {
                    lines.push(`  • Bulk: ${formatHours(calc.ambientH)} a ${temperature}°C`);
                }
                lines.push(`  • Levado final: ${formatHours(calc.finalProofTime)}`);
                if (doughType === 'pizza' && pizzaFreeze) {
                    const plan = thawPlan(pizzaThawRoute, temperature);
                    lines.push(`\nCONGELADO Y DESCONGELADO:`);
                    lines.push(`  • Congelar tras el levado final. Aguantan hasta 3 meses.`);
                    plan.steps.forEach(st => lines.push(`  • ${st.name}: ${formatHours(st.h)} a ${st.temp}`));
                    lines.push(`  • Total desde el congelador: ${formatHours(plan.total)}`);
                    if (plan.warn) lines.push(`  ! ${plan.warn}`);
                }
                return lines.join('\n');
            }, [calc, doughType, prefermentType, prefermentTime, prefermentTemp, hydration, saltPercent, useColdProof, temperature, pizzaFreeze, pizzaThawRoute, useMalt, maltPercent, pizzaFlour, pizzaHyd]);

            const copyRecipe = () => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(recipeText).then(() => {
                        showToast('Receta copiada al portapapeles ✓');
                    }).catch(() => {
                        showToast('Error al copiar');
                    });
                } else {
                    showToast('Portapapeles no disponible');
                }
            };

            const downloadRecipe = () => {
                const blob = new Blob([recipeText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `receta-${doughType}-${Date.now()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Receta descargada ✓');
            };

            const totalTimeAll = useMemo(() => {
                let t = calc.finalProofTime;
                if (doughType === 'pan') t += 0.4; // bench rest
                if (useColdProof) {
                    t += calc.ambientH + calc.coldH + calc.temperingTime;
                } else {
                    t += calc.ambientH;
                }
                if (doughType === 'pan' && hydration >= 75) t += 0.5; // autolysis
                if (prefermentType !== 'none') t += prefermentTime;
                return t;
            }, [calc, useColdProof, prefermentType, prefermentTime, doughType, hydration]);

            return (
                <>
                    <header className="app-header">
                        <div className="brand">
                            <div className="brand-mark">F</div>
                            <div className="brand-text">
                                <h1>Calculadora de Fermentación</h1>
                                <p>Panadería artesanal · cálculo asistido</p>
                            </div>
                        </div>
                        <div className="header-actions">
                            {wakeSupported && (
                                <button className={`icon-btn wake-btn ${wakeWanted ? 'on' : ''}`} onClick={toggleWake}
                                    title={wakeWanted ? 'Pantalla encendida — pulsa para liberar' : 'Mantener la pantalla encendida'}>
                                    <Icon name={wakeWanted ? 'eye' : 'eyeOff'} />
                                    <span>{wakeWanted ? 'Pantalla ON' : 'Pantalla'}</span>
                                </button>
                            )}
                            <button className="icon-btn" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                                title={theme === 'light' ? 'Modo oscuro' : 'Modo claro'}>
                                <Icon name={theme === 'light' ? 'moon' : 'sun'} />
                            </button>
                            {doughType !== 'panettone' && doughType !== 'focaccia' && doughType !== 'gofres' && (
                                <>
                                    <button className="icon-btn" onClick={copyRecipe} title="Copiar receta">
                                        <Icon name="copy" /> <span>Copiar</span>
                                    </button>
