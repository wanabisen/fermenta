    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora artesanal de fermentación: calcula levadura, hidratación, tiempos y plan de horneado para pan y pizza.">
    <title>Calculadora de Fermentación · Panadería Artesanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #f4f4f2;
            --bg-pattern:   rgba(20, 22, 26, 0.03);
            --surface:      #ffffff;
            --surface-2:    #ececea;
            --surface-3:    #e0e0dd;
            --border:       #cfcfcb;
            --border-soft:  #e2e2df;
            --text:         #14161a;
            --text-soft:    #4a4f57;
            --text-muted:   #71767f;
            --primary:      #14161a;
            --primary-dark: #000000;
            --primary-soft: #e6e6e3;
            --accent:       #14161a;
            --cold:         #0a6c8a;
            --cold-soft:    #dcedf3;
            --warm:         #b4530e;
            --warm-soft:    #fbe9d8;
            --success:      #1d6b46;
            --success-soft: #daeee4;
            --warning:      #8a5a00;
            --warning-soft: #fbeed2;
            --danger:       #b3261e;
            --danger-soft:  #fbe3e1;
            --shadow-sm:    0 1px 2px rgba(20,22,26,0.06);
            --shadow-md:    0 2px 10px rgba(20,22,26,0.08);
            --shadow-lg:    0 6px 28px rgba(20,22,26,0.12);
            --radius:       10px;
            --radius-sm:    7px;
            --font-ui:      'IBM Plex Sans', system-ui, sans-serif;
            --font-label:   'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
            --font-data:    'IBM Plex Mono', ui-monospace, monospace;
        }

        [data-theme="dark"] {
            --bg:           #101216;
            --bg-pattern:   rgba(255, 255, 255, 0.025);
            --surface:      #191c21;
            --surface-2:    #22262c;
            --surface-3:    #2c3138;
            --border:       #3a4048;
            --border-soft:  #2b3037;
            --text:         #eceef1;
            --text-soft:    #a8b0ba;
            --text-muted:   #7d858f;
            --primary:      #eceef1;
            --primary-dark: #ffffff;
            --primary-soft: #262b32;
            --accent:       #eceef1;
            --cold:         #5cc0e0;
            --cold-soft:    #10303c;
            --warm:         #f0a05c;
            --warm-soft:    #3a2410;
            --success:      #6fd39c;
            --success-soft: #123023;
            --warning:      #e8b356;
            --warning-soft: #33280d;
            --danger:       #f08a82;
            --danger-soft:  #3a1614;
            --shadow-sm:    0 1px 2px rgba(0,0,0,0.4);
            --shadow-md:    0 2px 10px rgba(0,0,0,0.45);
            --shadow-lg:    0 6px 28px rgba(0,0,0,0.6);
        }

        body {
            background: var(--bg);
            font-family: var(--font-ui);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 80% 50% at 20% 0%, var(--bg-pattern), transparent 70%),
                radial-gradient(ellipse 60% 60% at 80% 100%, var(--bg-pattern), transparent 70%);
            transition: background 0.3s, color 0.3s;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .serif { font-family: var(--font-label); }

        .app-header {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 1280px;
            margin: 0 auto;
        }
        .brand { display: flex; align-items: center; gap: 0.85rem; }
        .brand-mark {
            width: 44px; height: 44px;
            background: var(--accent);
            color: var(--bg);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-label);
            font-weight: 700; font-size: 1.25rem; font-style: italic;
        }
        [data-theme="dark"] .brand-mark { background: var(--primary); color: #1a140d; }
        .brand-text h1 {
            font-family: var(--font-label);
            font-size: 1.35rem; font-weight: 500;
            letter-spacing: -0.01em; line-height: 1.1;
        }
        .brand-text p {
            font-size: 0.78rem; color: var(--text-soft);
            text-transform: uppercase; letter-spacing: 0.12em;
            margin-top: 0.15rem;
        }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; }
        .wake-btn.on {
            background: var(--success-soft) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-soft);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem; font-family: inherit; font-weight: 500;
            display: flex; align-items: center; gap: 0.4rem;
            transition: all 0.15s;
        }
        .icon-btn:hover {
            background: var(--surface-2); color: var(--text);
            border-color: var(--text-muted);
        }
        .icon-btn svg { width: 16px; height: 16px; }

        .app-body { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }

        .hero-strip {
            background: var(--accent);
            color: var(--bg);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .hero-strip {
            background: linear-gradient(135deg, #2d2418 0%, #3a2e1f 100%);
            border: 1px solid var(--border);
        }
        .hero-strip::before {
            content: '';
            position: absolute; inset: 0;
            background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,0.025) 8px 9px);
            pointer-events: none;
        }
        .hero-stat { position: relative; z-index: 1; }
        .hero-stat .label {
            font-family: var(--font-label);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-soft);
            margin-bottom: 0.3rem;
        }
        [data-theme="dark"] .hero-strip .hero-stat .label {
            color: var(--text-muted);
        }
        .hero-stat .value {
            font-family: var(--font-data);
            font-size: 1.7rem;
            font-weight: 500;
            line-height: 1.05;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        [data-theme="dark"] .hero-strip .hero-stat .value {
            color: var(--text);
        }
        .hero-stat .unit {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-left: 0.15rem;
        }
        [data-theme="dark"] .hero-strip .hero-stat .unit {
            color: var(--text-muted);
        }

        .presets-row {
            display: flex; gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            scrollbar-width: thin;
        }
        .presets-row::-webkit-scrollbar { height: 4px; }
        .presets-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .preset-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.45rem 0.95rem;
            cursor: pointer;
            font-family: inherit; font-size: 0.83rem; font-weight: 500;
            color: var(--text-soft);
            transition: all 0.15s;
            white-space: nowrap;
            display: flex; align-items: center; gap: 0.35rem;
            flex-shrink: 0;
        }
        .preset-btn:hover {
            border-color: var(--primary); color: var(--primary-dark);
            background: var(--primary-soft);
        }
        .preset-btn.active {
            background: var(--accent); border-color: var(--accent); color: var(--bg);
        }
        [data-theme="dark"] .preset-btn.active {
            background: var(--primary); border-color: var(--primary); color: #1a140d;
        }

        .two-col {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

        .card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 1.35rem;
            box-shadow: var(--shadow-sm);
        }

        .section { margin-bottom: 1.75rem; }
        .section:last-child { margin-bottom: 0; }
        .section-label {
            font-family: var(--font-label);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-soft);
            margin-bottom: 0.85rem;
            display: flex; align-items: center; gap: 0.55rem;
        }
        .step-num {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px;
            background: var(--primary-soft); color: var(--primary-dark);
            border-radius: 50%;
            font-size: 0.75rem; font-weight: 700;
            font-family: var(--font-ui);
        }

        .dough-toggle {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
            gap: 0.5rem;
        }
        @media (max-width: 500px) {
            .dough-toggle { grid-template-columns: repeat(2, 1fr); }
        }
        .dough-btn {
            min-height: 52px;
            padding: 0.7rem 0.55rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            cursor: pointer; font-family: inherit;
            transition: all 0.18s;
            display: flex; flex-direction: column;
            align-items: flex-start; gap: 0.15rem; text-align: left;
            color: var(--text);
        }
        .dough-btn:hover { border-color: var(--primary); background: var(--primary-soft); }
        .dough-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        [data-theme="dark"] .dough-btn.active { background: var(--primary); border-color: var(--primary); color: #1a140d; }
        .dough-btn .top {
            display: flex; align-items: center; gap: 0.35rem;
            font-weight: 600; font-size: 0.85rem;
        }
        .dough-btn .emoji { font-size: 1.2rem; }
        .dough-btn .sub { font-size: 0.66rem; opacity: 0.75; font-weight: 400; line-height: 1.3; }

        /* Panettone-specific */
        .pan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .pan-mold-btn {
            min-height: 46px;
            padding: 0.6rem 0.5rem;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 0.78rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            color: var(--text-soft); font-family: inherit;
            display: flex; flex-direction: column;
            align-items: center; gap: 0.15rem; text-align: center;
        }
        .pan-mold-btn:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
        .pan-mold-btn.active {
            background: var(--accent); border-color: var(--accent); color: var(--bg);
        }
        [data-theme="dark"] .pan-mold-btn.active {
            background: var(--primary); border-color: var(--primary); color: #1a140d;
        }
        .pan-mold-btn .ms {
            font-size: 0.66rem; opacity: 0.75;
            font-variant-numeric: tabular-nums;
        }
        .pan-mold-btn.active .ms { opacity: 0.85; }

        .ph-pill {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background: var(--cold-soft); color: var(--cold);
            font-size: 0.72rem; font-weight: 600;
            padding: 0.15rem 0.55rem; border-radius: 999px;
            font-variant-numeric: tabular-nums;
            border: 1px solid var(--cold);
        }
        .ph-pill.warn { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); }
        .ph-pill.ok { background: var(--success-soft); color: var(--success); border-color: var(--success); }

        .recipe-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.83rem;
            margin-bottom: 0.75rem;
        }
        .recipe-table th, .recipe-table td {
            padding: 0.45rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-soft);
        }
        .recipe-table th {
            font-family: var(--font-label);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-soft);
            font-weight: 700;
            background: var(--surface-2);
        }
        .recipe-table td {
            color: var(--text);
        }
        .recipe-table td.qty {
            text-align: right;
            font-family: var(--font-data);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: var(--accent);
            white-space: nowrap;
        }
        [data-theme="dark"] .recipe-table td.qty { color: var(--primary); }
        .recipe-table td.note {
            font-size: 0.74rem;
            color: var(--text-soft);
            font-style: italic;
        }
        .recipe-table tr.subtotal td {
            background: var(--surface-2);
            font-weight: 700;
            color: var(--accent);
            border-bottom: 2px solid var(--border);
        }
        [data-theme="dark"] .recipe-table tr.subtotal td { color: var(--primary); }

        .phase-card {
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 1rem 1.15rem;
            margin-bottom: 0.85rem;
        }
        .phase-card-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.65rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border-soft);
        }
        .phase-card-title {
            font-family: var(--font-label);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            display: flex; align-items: center; gap: 0.45rem;
        }
        .phase-day {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-soft);
            font-weight: 600;
        }

        .checklist {
            list-style: none;
            display: flex; flex-direction: column;
            gap: 0.35rem;
        }
        .checklist li {
            display: flex; align-items: flex-start; gap: 0.55rem;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.84rem;
            line-height: 1.4;
        }
        .checklist li:hover { background: var(--surface-2); }
        .checklist li.done {
            color: var(--text-soft);
            text-decoration: line-through;
            opacity: 0.7;
        }
        .check-box {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.15s;
            background: var(--surface);
        }
        .checklist li.done .check-box {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        .check-day {
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            min-width: 70px;
            flex-shrink: 0;
        }

        .danger-box {
            background: var(--danger-soft);
            border-left: 3px solid var(--danger);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0.7rem 0.95rem;
            font-size: 0.82rem;
            color: var(--text);
            margin-bottom: 0.6rem;
        }
        .danger-box-title {
            font-weight: 700; color: var(--danger);
            margin-bottom: 0.25rem;
            display: flex; align-items: center; gap: 0.35rem;
        }

        .accordion {
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            padding: 0.7rem 0.95rem;
            background: var(--surface-2);
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.5rem;
        }
        .accordion-header:hover { background: var(--surface-3); }
        .accordion-header .arrow {
            transition: transform 0.2s;
            color: var(--text-soft);
        }
        .accordion.open .accordion-header .arrow { transform: rotate(90deg); }
        .accordion-body {
            padding: 0 0.95rem 0.85rem;
            font-size: 0.82rem;
            color: var(--text-soft);
            line-height: 1.55;
        }

        .slider-group { display: flex; flex-direction: column; gap: 1.1rem; }
        .slider-row { display: flex; flex-direction: column; gap: 0.45rem; }
        .slider-label {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.85rem; font-weight: 500;
        }
        .slider-label.disabled { opacity: 0.45; }
        .slider-label-left {
            display: flex; align-items: center; gap: 0.45rem;
            color: var(--text);
        }
        .slider-label-left .ic {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px;
            background: var(--surface-2); border-radius: 6px;
            font-size: 0.95rem;
        }
        /* ── Bloques por etapa: deja claro qué controla el prefermento y qué la masa final ── */
        .stage-block {
            position: relative;
            border-left: 3px solid var(--border);
            border-radius: 0;
            padding: 1.5rem 0 0.25rem 0.9rem;
            margin-top: 0.9rem;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .stage-block.stage-pref { border-left-color: var(--cold); }
        .stage-block.stage-final { border-left-color: var(--primary); }
        .stage-tag {
            position: absolute; top: 0; left: 0.9rem;
            font-size: 0.64rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
            padding: 0.15rem 0.5rem; border-radius: 4px;
        }
        .stage-pref .stage-tag { background: var(--cold-soft); color: var(--cold); }
        .stage-final .stage-tag { background: var(--primary-soft); color: var(--primary-dark); }
        [data-theme="dark"] .stage-final .stage-tag { color: var(--primary); }

        /* ── Línea de tiempo: ancho = duración real, color = etapa ── */
        .timeline { margin-bottom: 1.4rem; }
        .timeline-head {
            display: flex; align-items: baseline; justify-content: space-between;
            font-family: var(--font-label);
            font-size: 0.72rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-soft);
            margin-bottom: 0.45rem;
        }
        .timeline-total {
            font-family: var(--font-data);
            font-size: 0.8rem; letter-spacing: 0;
            text-transform: none; color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .timeline-track {
            display: flex; gap: 3px;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .leg {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1px;
            padding: 0.5rem 0.3rem;
            min-width: 0; overflow: hidden;
            transition: flex-grow 0.25s ease-out;
        }
        .leg-name {
            font-family: var(--font-label);
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.04em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%;
        }
        .leg-h {
            font-family: var(--font-data);
            font-size: 0.95rem; font-weight: 500;
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
            white-space: nowrap;
        }
        .leg-t {
            font-family: var(--font-data);
            font-size: 0.66rem;
            font-variant-numeric: tabular-nums;
            opacity: 0.75;
            white-space: nowrap;
        }
        .leg-pref  { background: #d8ecdf; color: #14532c; }
        .leg-cold  { background: #d4e9f2; color: #0a4d63; }
        .leg-final { background: #fae0c8; color: #8a3c05; }
        .leg-bake  {
            background: #f8d9d5; color: #8a1a14;
            flex: 0 0 42px; font-size: 1.05rem;
        }
        [data-theme="dark"] .leg-pref  { background: #163a26; color: #8fd9ab; }
        [data-theme="dark"] .leg-cold  { background: #10333f; color: #7fcde6; }
        [data-theme="dark"] .leg-final { background: #3d2712; color: #f2ab6b; }
        [data-theme="dark"] .leg-bake  { background: #3d1815; color: #f29b93; }

        .choice-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
            gap: 0.4rem;
        }
        .choice-btn {
            min-height: 46px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit; font-size: 0.95rem; font-weight: 600;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: all 0.12s;
            touch-action: manipulation;
        }
        .choice-btn:hover:not(.active) { border-color: var(--primary); background: var(--primary-soft); }
        .choice-btn:active { transform: scale(0.94); }
        .choice-btn.active {
            background: var(--accent); border-color: var(--accent); color: var(--bg);
        }
        [data-theme="dark"] .choice-btn.active { background: var(--primary); border-color: var(--primary); color: #1a140d; }
        .choice-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* ── Stepper: sustituye al slider, funciona igual en ratón y táctil ── */
        .stepper {
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            gap: 0.5rem;
            align-items: stretch;
        }
        .stepper-btn {
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit; font-size: 1.35rem; font-weight: 500;
            line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s, border-color 0.12s, transform 0.08s;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
        }
        .stepper-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
        .stepper-btn:active:not(:disabled) { transform: scale(0.94); background: var(--primary-soft); }
        .stepper-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .stepper-value {
            height: 44px;
            font-family: var(--font-data);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--accent); color: var(--bg);
            font-size: 1.05rem; font-weight: 500;
            font-variant-numeric: tabular-nums;
            cursor: text;
            display: flex; align-items: center; justify-content: center; gap: 0.25rem;
            width: 100%;
            transition: filter 0.12s;
            touch-action: manipulation;
        }
        [data-theme="dark"] .stepper-value { background: var(--primary); color: #1a140d; border-color: var(--primary); }
        .stepper-value:hover:not(.disabled):not(.editing) { filter: brightness(1.08); }
        .stepper-value .u { font-size: 0.8rem; font-weight: 500; opacity: 0.85; }
        .stepper-value.disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.6; }
        .stepper-value.editing {
            background: var(--surface); color: var(--text);
            border: 2px solid var(--primary);
            text-align: center;
            -moz-appearance: textfield;
        }
        .stepper-value.editing::-webkit-outer-spin-button,
        .stepper-value.editing::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Barra de posición dentro del rango — informativa, no arrastrable */
        .range-bar {
            height: 3px; border-radius: 3px;
            background: var(--border);
            overflow: hidden;
            margin-top: 0.15rem;
        }
        .range-fill {
            height: 100%; border-radius: 3px;
            background: var(--primary);
            transition: width 0.15s ease-out;
        }
        .range-bar.disabled { opacity: 0.35; }
        .range-ends {
            display: flex; justify-content: space-between;
            font-size: 0.68rem; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-top: -0.1rem;
        }
        .range-ends.disabled { opacity: 0.4; }

        input[type="number"], input[type="time"], input[type="text"] {
            font-family: inherit; font-size: 0.85rem;
            padding: 0.35rem 0.55rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface); color: var(--text);
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        input[type="number"] { width: 64px; }
        input[type="number"]:disabled { opacity: 0.4; }
        input[type="time"] { min-height: 40px; }

        .slider-hint {
            font-size: 0.74rem; color: var(--text-soft);
            margin-top: -0.15rem; font-style: italic;
        }
        .slider-warning {
            font-size: 0.74rem; color: var(--warning);
            margin-top: 0.15rem; font-weight: 500;
            display: flex; align-items: center; gap: 0.3rem;
        }

        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.5rem;
        }
        .pref-pill {
            padding: 0.6rem 0.75rem;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 0.83rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            color: var(--text-soft); font-family: inherit;
            display: flex; flex-direction: column;
            align-items: center; gap: 0.15rem; text-align: center;
        }
        .pref-pill:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
        .pref-pill.active {
            background: var(--accent); border-color: var(--accent); color: var(--bg);
        }
        [data-theme="dark"] .pref-pill.active {
            background: var(--primary); border-color: var(--primary); color: #1a140d;
        }
        .pref-pill .e { font-size: 1.1rem; }
        .pref-pill .h {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 500; font-variant-numeric: tabular-nums;
        }
        .pref-pill.active .h { color: rgba(255,255,255,0.75); }
        [data-theme="dark"] .pref-pill.active .h { color: rgba(26,20,13,0.7); }

        .pref-info {
            margin-top: 0.85rem;
            padding: 0.85rem 1rem;
            background: var(--primary-soft);
            border-left: 3px solid var(--primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-size: 0.85rem; color: var(--text-soft);
            line-height: 1.55;
        }
        .pref-info-title {
            display: flex; justify-content: space-between;
            margin-bottom: 0.4rem;
            font-weight: 600; color: var(--accent);
            font-family: var(--font-label); font-size: 0.95rem;
        }
        [data-theme="dark"] .pref-info-title { color: var(--primary); }
        .pref-info-meta {
            display: flex; gap: 0.35rem; font-size: 0.7rem;
        }
        .pref-info-meta span {
            background: var(--accent); color: var(--bg);
            padding: 0.1rem 0.5rem; border-radius: 999px;
            font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        [data-theme="dark"] .pref-info-meta span { background: var(--primary); color: #1a140d; }
        .pref-info-tip {
            margin-top: 0.5rem; font-size: 0.78rem; color: var(--success);
            display: flex; align-items: flex-start; gap: 0.35rem;
            font-weight: 500;
        }
        .pref-info-flavor {
            margin-top: 0.3rem; font-size: 0.78rem;
            font-style: italic; color: var(--text-soft);
        }

        .toggle-row {
            display: flex; align-items: center;
            justify-content: space-between; gap: 0.75rem;
            padding: 0.6rem 0.85rem;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
        }
        .toggle-label {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.88rem; font-weight: 500; color: var(--text);
        }
        .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: var(--border);
            border-radius: 24px; cursor: pointer;
            transition: 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            left: 3px; top: 3px;
            background: white; border-radius: 50%;
            transition: 0.2s; box-shadow: var(--shadow-sm);
        }
        input:checked + .toggle-slider { background: var(--cold); }
        input:checked + .toggle-slider::before { transform: translateX(20px); }

        .indent-group {
            padding-left: 1rem;
            border-left: 2px solid var(--border-soft);
            margin-top: 0.85rem;
            display: flex; flex-direction: column; gap: 1rem;
        }

        .tabs {
            display: flex; gap: 0.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }
        .tab {
            font-family: var(--font-label);
            padding: 0.6rem 0.9rem;
            border: none;
            border-bottom: 2px solid transparent;
            background: none;
            color: var(--text-soft);
            font-size: 0.85rem; font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        [data-theme="dark"] .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .ing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.6rem; margin-bottom: 1rem;
        }
        .ing-card {
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            padding: 0.85rem 0.75rem;
            text-align: center;
        }
        .ing-card .l {
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-soft);
            margin-bottom: 0.35rem; font-weight: 600;
        }
        .ing-card .v {
            font-family: var(--font-data);
            font-family: var(--font-label);
            font-size: 1.65rem; font-weight: 500;
            color: var(--text); line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .ing-card .u {
            font-size: 0.72rem; color: var(--text-soft);
            margin-top: 0.15rem;
        }

        .yeast-card {
            background: var(--success-soft);
            border: 1px solid var(--success);
            border-radius: var(--radius-sm);
            padding: 1rem; text-align: center;
            margin-bottom: 1rem;
        }
        .yeast-card .l {
            font-size: 0.72rem; text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--success); font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .yeast-card .v {
            font-family: var(--font-label);
            font-size: 2.2rem; font-weight: 500;
            color: var(--text); line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .yeast-card .u {
            font-size: 0.75rem; color: var(--text-soft);
            margin-top: 0.25rem;
        }
        .yeast-card .tiny {
            font-size: 0.7rem; color: var(--text-soft);
            margin-top: 0.45rem; padding-top: 0.45rem;
            border-top: 1px dashed var(--border);
        }

        .schedule-input {
            display: flex; align-items: center;
            justify-content: space-between;
            background: var(--surface-2);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
        }
        .schedule-input label {
            font-size: 0.83rem; font-weight: 500;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .schedule {
            background: var(--surface-2);
            border-radius: var(--radius);
            padding: 0.5rem;
            margin-bottom: 1rem;
        }
        .schedule-row {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 0.75rem; align-items: center;
            padding: 0.7rem 0.85rem;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }
        .schedule-row + .schedule-row { margin-top: 0.2rem; }
        .schedule-row:hover { background: var(--surface); }
        .schedule-time {
            font-family: var(--font-label);
            font-size: 1.05rem; font-weight: 500;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }
        [data-theme="dark"] .schedule-time { color: var(--primary); }
        .schedule-step {
            display: flex; flex-direction: column;
            gap: 0.1rem; min-width: 0;
        }
        .schedule-step .name {
            font-weight: 600; font-size: 0.92rem;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .schedule-step .ic {
            display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px;
            background: var(--surface);
            border-radius: 50%;
            font-size: 0.95rem; flex-shrink: 0;
        }
        .schedule-step .desc {
            font-size: 0.78rem; color: var(--text-soft);
            padding-left: 32px;
        }
        .schedule-duration {
            font-size: 0.78rem; color: var(--text-soft);
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .schedule-row.cold { background: var(--cold-soft); }
        .schedule-row.cold .schedule-time { color: var(--cold); }
        .schedule-row.cold .schedule-step .desc,
        .schedule-row.cold .schedule-duration { color: var(--text-soft); }
        .schedule-row.bake { background: var(--warm-soft); }
        .schedule-row.bake .schedule-time { color: var(--warm); }
        .schedule-row.bake .schedule-step .desc,
        .schedule-row.bake .schedule-duration { color: var(--text-soft); }
        .schedule-row.start { background: var(--success-soft); }
        .schedule-row.start .schedule-time { color: var(--success); }

        .bake-card {
            background: var(--surface-2);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .bake-header {
            background: var(--warm); color: white;
            padding: 0.7rem 1rem;
            font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            display: flex; align-items: center; gap: 0.45rem;
        }
        .bake-preheat {
            padding: 0.85rem 1rem;
            background: var(--warm-soft);
            display: flex; align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .bake-preheat .pt {
            font-family: var(--font-label);
            font-weight: 500; font-size: 1rem;
            color: var(--warm);
        }
        .bake-note {
            padding: 0.6rem 1rem;
            font-size: 0.78rem; color: var(--text-soft);
            background: var(--surface-2);
            border-top: 1px solid var(--border-soft);
            display: flex; align-items: flex-start; gap: 0.4rem;
        }
        .bake-phase {
            padding: 0.85rem 1rem;
            border-top: 1px solid var(--border-soft);
        }
        .bake-phase-title {
            font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--accent); margin-bottom: 0.6rem;
        }
        [data-theme="dark"] .bake-phase-title { color: var(--primary); }
        .bake-stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem; margin-bottom: 0.6rem;
        }
        .bake-stat {
            text-align: center; padding: 0.5rem;
            border-radius: 6px; background: var(--surface);
        }
        .bake-stat .v {
            font-family: var(--font-data);
            font-family: var(--font-label);
            font-weight: 600; font-size: 0.95rem;
            color: var(--text);
        }
        .bake-stat .l {
            font-size: 0.66rem; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--text-soft);
            margin-top: 0.15rem;
        }
        .bake-action {
            font-size: 0.82rem; color: var(--text-soft);
            background: var(--surface);
            border-radius: 6px;
            padding: 0.55rem 0.7rem;
            line-height: 1.5;
        }

        .pref-box {
            background: var(--primary-soft);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .pref-box-header {
            background: var(--primary); color: white;
            padding: 0.7rem 1rem;
            font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            display: flex; align-items: center;
            justify-content: space-between;
        }
        .pref-box-body { padding: 0.85rem; }
        [data-theme="dark"] .pref-box-header { color: #1a140d; }

        .info-note {
            background: var(--surface-2);
            border-left: 3px solid var(--primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0.7rem 0.95rem;
            font-size: 0.78rem; color: var(--text-soft);
            line-height: 1.55;
        }
        .info-note strong { color: var(--text); font-weight: 600; }

        .warn-box {
            background: var(--warning-soft);
            border-left: 3px solid var(--warning);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0.7rem 0.95rem;
            font-size: 0.8rem; color: var(--text);
            display: flex; align-items: flex-start; gap: 0.45rem;
            margin-bottom: 1rem;
        }

        .quality-bar {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.78rem;
            margin-bottom: 0.85rem;
            padding: 0.6rem 0.85rem;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            color: var(--text-soft);
        }
        .quality-bar strong { color: var(--text); }
        .quality-dots { display: flex; gap: 3px; }
        .qd { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
        .qd.on { background: var(--success); }
        .qd.warn { background: var(--warning); }
        .qd.bad { background: var(--danger); }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .stepper-btn:focus-visible, .stepper-value:focus-visible {
            outline: 2px solid var(--primary); outline-offset: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.25s ease both; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .toast {
            position: fixed;
            bottom: 1.5rem; left: 50%;
            transform: translateX(-50%);
            background: var(--accent); color: var(--bg);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            font-size: 0.85rem; font-weight: 500;
            display: flex; align-items: center; gap: 0.5rem;
            z-index: 9999;
            animation: toastIn 0.25s ease both;
        }
        [data-theme="dark"] .toast { background: var(--primary); color: #1a140d; }

        .modified-badge {
            display: inline-flex; align-items: center; gap: 0.25rem;
            background: var(--warning-soft); color: var(--warning);
            font-size: 0.65rem; font-weight: 600;
            padding: 0.1rem 0.45rem;
            border-radius: 999px;
            margin-left: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .difficulty {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.72rem; font-weight: 600;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .difficulty-bars { display: flex; gap: 2px; }
        .db {
            width: 4px; height: 12px;
            background: var(--border);
            border-radius: 1px;
        }
        .db.on { background: var(--primary); }

        .tooltip-trigger {
            display: inline-flex; align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--surface-3);
            color: var(--text-soft);
            font-size: 0.7rem; font-weight: 700;
            cursor: help;
            margin-left: 0.3rem;
            font-family: var(--font-label);
            font-style: italic;
            user-select: none;
            position: relative;
        }
        .tooltip-trigger:hover { background: var(--primary); color: white; }
        .tooltip-trigger[data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--bg);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 400;
            font-family: var(--font-ui);
            font-style: normal;
            white-space: normal;
            width: 220px;
            line-height: 1.4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            text-align: left;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        [data-theme="dark"] .tooltip-trigger[data-tip]::after { background: var(--primary); color: #1a140d; }
        .tooltip-trigger:hover[data-tip]::after { opacity: 1; }

        .reset-link {
            background: transparent; border: none;
            color: var(--text-soft);
            font-family: inherit; font-size: 0.78rem;
            cursor: pointer; text-decoration: underline;
            padding: 0;
        }
        .reset-link:hover { color: var(--text); }

        #cookie-consent-banner {
            position: fixed; bottom: 1rem; left: 1rem; right: 1rem;
            max-width: 480px; margin: 0 auto;
            background: var(--accent); color: var(--bg);
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            z-index: 10000; font-family: inherit;
            box-shadow: var(--shadow-lg);
            display: none;
            font-size: 0.83rem; line-height: 1.5;
        }
        #cookie-consent-banner p { margin-bottom: 0.85rem; opacity: 0.9; }
        #cookie-consent-banner a { color: var(--primary); }
        .cookie-btns { display: flex; gap: 0.5rem; }
        .cookie-btn {
            flex: 1;
            padding: 0.5rem 1rem; border: none;
            border-radius: var(--radius-sm); cursor: pointer;
            font-weight: 600; font-family: inherit;
            font-size: 0.82rem;
        }
        .btn-accept { background: var(--primary); color: white; }
        .btn-reject {
            background: transparent; color: var(--bg);
            border: 1px solid rgba(255,255,255,0.25);
        }

        @media print {

        const REF_TEMP = 22, REF_TIME = 3, REF_YEAST = 0.4, FRIDGE_TEMP = 4;

            if (temp < 4) return 0.15;

            return Math.pow(2, (temp - REF_TEMP) / 10);

            return (REF_YEAST * REF_TIME) / (hours * rateFactor(temp));

            const activity = ambientH * rateFactor(ambientT) + coldH * rateFactor(FRIDGE_TEMP);

                download: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>),
                refresh: (<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>),
                alert: (<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></>),
                check: <polyline points="20 6 9 17 4 12"/>,
                eye: (<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></>),
                eyeOff: (<><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><line x1="2" y1="2" x2="22" y2="22"/></>),
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {paths[name]}
                </svg>
            );
        };

        // ============================================================
        // CHOICE ROW — para rangos cortos (1-10): un toque, sin arrastrar
        // ============================================================
        const ChoiceRow = ({ label, icon, value, onChange, min, max, unit, tip, hint }) => {
            const opts = [];
            for (let i = min; i <= max; i++) opts.push(i);
            return (
                <div className="slider-row">
                    <div className="slider-label">
                        <span className="slider-label-left">
                            {icon && <span className="ic">{icon}</span>}
                            {label}
                            {tip && <span className="tooltip-trigger" data-tip={tip}>i</span>}
                        </span>
                        {unit && <span style={{fontSize: '0.78rem', color: 'var(--text-soft)'}}>{value} {unit}</span>}
                    </div>
                    <div className="choice-row">
                        {opts.map(n => (
                            <button key={n} type="button"
                                className={`choice-btn ${value === n ? 'active' : ''}`}
                                onClick={() => onChange(n)}>{n}</button>
                        ))}
                    </div>
                    {hint && <div className="slider-hint">{hint}</div>}
                </div>
            );
        };

        // ============================================================
        // SLIDER
        // ============================================================
        const Slider = ({ label, icon, value, onChange, min, max, step, unit, disabled, hint, warning, tip, hidden }) => {
            if (hidden) return null;

            const nMin = parseFloat(min), nMax = parseFloat(max), nStep = parseFloat(step) || 1;
            const [editing, setEditing] = useState(false);
            const [draft, setDraft] = useState('');
            const holdRef = React.useRef(null);

            const clamp = (v) => Math.min(nMax, Math.max(nMin, v));
            const decimals = (String(nStep).split('.')[1] || '').length;
            const snap = (v) => parseFloat(clamp(v).toFixed(decimals));

            const bump = (dir) => { if (!disabled) onChange(snap(value + dir * nStep)); };
            const bumpRef = React.useRef(bump);
            bumpRef.current = bump;

            // Mantener pulsado acelera: 500ms de espera, luego cada vez más rápido
            const startHold = (dir) => {
                if (disabled) return;
                let delay = 500, ticks = 0;
                const tick = () => {
                    ticks++;
                    if (ticks > 4 && delay > 60) delay = Math.max(60, delay * 0.7);
                    bumpRef.current(dir);
                    holdRef.current = setTimeout(tick, delay);
                };
                holdRef.current = setTimeout(tick, delay);
            };
            const stopHold = () => { if (holdRef.current) { clearTimeout(holdRef.current); holdRef.current = null; } };
            useEffect(() => stopHold, []);

            const commitDraft = () => {
                const parsed = parseFloat(String(draft).replace(',', '.'));
                if (!isNaN(parsed)) onChange(snap(parsed));
                setEditing(false);
            };

            const pct = nMax > nMin ? ((clamp(value) - nMin) / (nMax - nMin)) * 100 : 0;
            const atMin = value <= nMin, atMax = value >= nMax;

            return (
            <div className="slider-row">
                <div className={`slider-label ${disabled ? 'disabled' : ''}`}>
                    <span className="slider-label-left">
                        {icon && <span className="ic">{icon}</span>}
                        {label}
                        {tip && <span className="tooltip-trigger" data-tip={tip}>i</span>}
                    </span>
                </div>

                <div className="stepper">
                    <button type="button" className="stepper-btn" aria-label="Reducir"
                        disabled={disabled || atMin}
                        onClick={() => bump(-1)}
                        onPointerDown={() => startHold(-1)}
                        onPointerUp={stopHold} onPointerLeave={stopHold} onPointerCancel={stopHold}>−</button>

                    {editing && !disabled ? (
                        <input className="stepper-value editing" type="number" autoFocus
                            value={draft} min={min} max={max} step={step}
                            onChange={e => setDraft(e.target.value)}
                            onBlur={commitDraft}
                            onKeyDown={e => { if (e.key === 'Enter') commitDraft(); if (e.key === 'Escape') setEditing(false); }} />
                    ) : (
                        <button type="button" className={`stepper-value ${disabled ? 'disabled' : ''}`}
                            disabled={disabled}
                            title="Tocar para escribir un valor"
                            onClick={() => { setDraft(String(value)); setEditing(true); }}>
                            {value}{unit && <span className="u"> {unit}</span>}
                        </button>
                    )}

                    <button type="button" className="stepper-btn" aria-label="Aumentar"
                        disabled={disabled || atMax}
                        onClick={() => bump(1)}
                        onPointerDown={() => startHold(1)}
                        onPointerUp={stopHold} onPointerLeave={stopHold} onPointerCancel={stopHold}>+</button>
                </div>

                <div className={`range-bar ${disabled ? 'disabled' : ''}`} aria-hidden="true">
                    <div className="range-fill" style={{width: pct + '%'}}></div>
                </div>
                <div className={`range-ends ${disabled ? 'disabled' : ''}`}>
                    <span>{min}{unit ? ' ' + unit : ''}</span>
                    <span>{max}{unit ? ' ' + unit : ''}</span>
                </div>

                {hint && !disabled && <div className="slider-hint">{hint}</div>}
                {warning && !disabled && <div className="slider-warning"><Icon name="alert" size={12}/> {warning}</div>}
            </div>
            );
        };

        // ============================================================
        // FORMAT HELPERS
        // ============================================================
        const formatHours = (hours) => {
            if (!hours || hours <= 0) return '—';
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            if (h === 0) return `${m} min`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        };

        const addHours = (date, hours) => new Date(date.getTime() + hours * 3600000);
        const formatClock = (date) => date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const formatDay = (date, ref) => {
            const d1 = new Date(date); d1.setHours(0,0,0,0);
            const d2 = new Date(ref); d2.setHours(0,0,0,0);
            const diff = Math.round((d1 - d2) / 86400000);
            if (diff === 0) return '';
            if (diff === -1) return '(día -1)';
            if (diff === -2) return '(día -2)';
            if (diff === 1) return '(día siguiente)';
            return diff > 0 ? `(+${diff}d)` : `(${diff}d)`;
        };

        // ============================================================
        // PREFERMENT INFO
        // ============================================================
        const PrefermentInfo = ({ type }) => {
            const info = PREFERMENTS[type];
            if (!info || type === 'none') return null;
            return (
                <div className="pref-info animate-in">
                    <div className="pref-info-title">
                        <span>{info.name}</span>
                        <div className="pref-info-meta"><span>{info.hydration}%</span></div>
                    </div>
                    {info.desc}
                    <div className="pref-info-tip">💡 {info.tip}</div>
                    <div className="pref-info-flavor">🫙 {info.flavor}</div>
                </div>
            );
        };

        // ============================================================
        // BAKING PLAN
        // ============================================================
        const BakingPlan = ({ plan }) => (
            <div className="bake-card animate-in">
                <div className="bake-header">🔥 Plan de horneado</div>
                <div className="bake-preheat">
                    <span>Precalentamiento</span>
                    <span><span className="pt">{plan.preheat.temp}</span> · {plan.preheat.time}</span>
                </div>
                <div className="bake-note">⚠️ {plan.preheat.notes}</div>
                {plan.phases.map((phase, i) => (
                    <div key={i} className="bake-phase">
                        <div className="bake-phase-title">Fase {i + 1} — {phase.name}</div>
                        <div className="bake-stats">
                            <div className="bake-stat"><div className="v">{phase.temp}</div><div className="l">Temp.</div></div>
                            <div className="bake-stat"><div className="v">{phase.time}</div><div className="l">Tiempo</div></div>
                            <div className="bake-stat"><div className="v" style={{fontSize:'0.78rem'}}>{phase.mode}</div><div className="l">Modo</div></div>
                        </div>
                        <div className="bake-action">{phase.action}</div>
                    </div>
                ))}
                <div className="bake-note">❄️ {plan.cooling}</div>
            </div>
        );

        // ============================================================
        // QUALITY CHECK
        // ============================================================
        const useQualityCheck = (params) => useMemo(() => {
            const issues = [];
            const { doughType, hydration, saltPercent, temperature, totalTime, useColdProof, coldProofTime, prefermentType, prefermentTemp } = params;

            // Hydration and salt warnings only apply to pan (pizza uses fixed canonical values)
            if (doughType === 'pan' && hydration < 55) issues.push({ level: 'warn', msg: 'Hidratación baja: la miga será densa.' });
            if (doughType === 'pan' && hydration > 85) issues.push({ level: 'warn', msg: 'Hidratación muy alta: requiere técnica avanzada (folds frecuentes, pliegues en frío).' });
            if (doughType === 'pan' && saltPercent < 1.5) issues.push({ level: 'warn', msg: 'Poca sal: fermentación demasiado rápida y poco sabor.' });
            if (doughType === 'pan' && saltPercent > 3) issues.push({ level: 'warn', msg: 'Demasiada sal: puede inhibir la levadura.' });
            if (temperature < 16) issues.push({ level: 'info', msg: 'Temperatura baja: la fermentación será muy lenta.' });
            if (temperature > 28) issues.push({ level: 'warn', msg: 'Temperatura alta: la masa puede sobrefermentar y desarrollar acidez excesiva.' });
            if (!useColdProof && totalTime < 1.5) issues.push({ level: 'warn', msg: 'Tiempo muy corto: la masa no desarrollará sabor.' });
            if (useColdProof && coldProofTime > 48) issues.push({ level: 'info', msg: 'Frío muy largo: vigila signos de sobrefermentación al sacar.' });

            if (prefermentType !== 'none' && prefermentType !== 'masa_madre') {
                const ideal = PREFERMENTS[prefermentType].ideal;
                if (prefermentTemp < ideal.temp[0] - 2) issues.push({ level: 'info', msg: `${PREFERMENTS[prefermentType].name}: temperatura por debajo del rango ideal (${ideal.temp[0]}-${ideal.temp[1]}°C).` });
                if (prefermentTemp > ideal.temp[1] + 2) issues.push({ level: 'warn', msg: `${PREFERMENTS[prefermentType].name}: temperatura por encima del rango ideal, riesgo de sobrefermentación.` });
            }

            let score = 5;
            issues.forEach(i => {
                if (i.level === 'bad') score -= 2;
                else if (i.level === 'warn') score -= 1;
            });
            return { issues, score: clamp(score, 1, 5) };
        }, [params]);

        // ============================================================
        // CHECKLIST COMPONENT (compartido: focaccia, gofres, panettone)
        // ============================================================
        const Checklist = ({ items, checks, onToggle, onReset, note }) => {
            const done = items.filter(c => checks[c.id]).length;
            const pct = items.length ? (done / items.length) * 100 : 0;
            return (
                <div className="animate-in">
                    <div className="quality-bar">
                        <span style={{fontWeight: 600}}>Progreso:</span>
                        <span style={{color: 'var(--text-soft)', fontSize: '0.85rem', fontVariantNumeric: 'tabular-nums'}}>{done} / {items.length}</span>
                        <div style={{flex: 1, height: '6px', background: 'var(--border)', borderRadius: '3px', overflow: 'hidden', marginLeft: '0.5rem'}}>
                            <div style={{width: `${pct}%`, height: '100%', background: 'var(--success)', transition: 'width 0.3s'}}></div>
                        </div>
                        {onReset && done > 0 && (
                            <button className="icon-btn" style={{marginLeft: '0.5rem'}} onClick={onReset}>↻</button>
                        )}
                    </div>
                    <ul className="checklist">
                        {items.map(c => (
                            <li key={c.id} className={checks[c.id] ? 'done' : ''} onClick={() => onToggle(c.id)}>
                                <span className="check-box">
                                    {checks[c.id] && <Icon name="check" size={12}/>}
                                </span>
                                {c.day && <span className="check-day">{c.day}</span>}
                                <span style={{flex: 1}}>{c.text}</span>
                            </li>
                        ))}
                    </ul>
                    <div className="info-note" style={{marginTop: '1rem'}}>
                        {note || 'Marca cada paso a medida que avanzas. El progreso se guarda automáticamente.'}
                    </div>
                </div>
            );
        };

        // ============================================================
        // PIZZA TOPPINGS COMPONENT
        // Multi-pizza selector with per-pizza ingredients + shopping list
        // ============================================================
        const PizzaToppings = ({ counts, setCounts, maxPizzas, view = 'assign', showToast }) => {
            const totalPizzas = Object.values(counts).reduce((s, n) => s + n, 0);
            const remaining = Math.max(0, maxPizzas - totalPizzas);
            const isAtLimit = totalPizzas >= maxPizzas;
            const isOverLimit = totalPizzas > maxPizzas;

            // Aggregate ingredients across all selected pizzas
            const shoppingList = useMemo(() => {
                const totals = {};
                Object.entries(counts).forEach(([variantId, count]) => {
                    if (count <= 0) return;
                    const variant = PIZZA_VARIANTS[variantId];
                    variant.ingredients.forEach(ing => {
                        if (!totals[ing.id]) {
                            totals[ing.id] = { total: 0, unit: ing.unit };
                        }
                        totals[ing.id].total += ing.g * count;
                    });
                });
                return totals;
            }, [counts]);

            const setCount = (id, delta) => {
                setCounts(prev => {
                    const currentTotal = Object.values(prev).reduce((s, n) => s + n, 0);
                    const newValue = Math.max(0, (prev[id] || 0) + delta);
                    // Block increase if it would exceed maxPizzas
                    if (delta > 0 && currentTotal >= maxPizzas) {
                        showToast(`Límite alcanzado: ${maxPizzas} bolas`);
                        return prev;
                    }
                    return { ...prev, [id]: newValue };
                });
            };

            const setCountValue = (id, value) => {
                setCounts(prev => {
                    const requested = Math.max(0, parseInt(value) || 0);
                    const others = Object.entries(prev).reduce((s, [k, n]) => k === id ? s : s + n, 0);
                    const maxAllowed = Math.max(0, maxPizzas - others);
                    const finalValue = Math.min(requested, maxAllowed);
                    if (requested > maxAllowed) {
                        showToast(`Solo ${maxAllowed} ${maxAllowed === 1 ? 'bola disponible' : 'bolas disponibles'}`);
                    }
                    return { ...prev, [id]: finalValue };
                });
            };

            const resetCounts = () => {
                if (!window.confirm('¿Poner todas las pizzas a 0?')) return;
                const zeroed = {};
                Object.keys(PIZZA_VARIANTS).forEach(k => zeroed[k] = 0);
                setCounts(zeroed);
                showToast('Pizzas reseteadas');
            };

            const autoDistribute = () => {
                // Distribute proportionally to the default suggestion: marghe 3, diavola 2, speck 2, pollo 2, marinara 1, quattro 1, bianca 1
                const weights = {
                    margherita: 3, diavola: 2, speck_gorgonzola: 2,
                    pollo_maiz: 2, marinara: 1, quattro_formaggi: 1,
                    bianca_speck: 1, cacio_pepe: 1, capricciosa: 0,
                };
                const totalWeight = Object.values(weights).reduce((s, n) => s + n, 0);
                const distributed = {};
                let assigned = 0;
                // First pass: round down
                Object.entries(weights).forEach(([k, w]) => {
                    const v = Math.floor((w / totalWeight) * maxPizzas);
                    distributed[k] = v;
                    assigned += v;
                });
                // Distribute remainder to highest weights
                const sortedKeys = Object.entries(weights).sort((a, b) => b[1] - a[1]).map(e => e[0]);
                let i = 0;
                while (assigned < maxPizzas && i < sortedKeys.length * 5) {
                    distributed[sortedKeys[i % sortedKeys.length]]++;
                    assigned++;
                    i++;
                }
                setCounts(distributed);
                showToast(`Reparto sugerido para ${maxPizzas} bolas`);
            };

            // Build a text summary for copy
            const buildText = () => {
                const lines = [];
                lines.push(`PIZZAS — ${totalPizzas} unidades en total`);
                lines.push('═══════════════════════════════════════');

                Object.entries(counts).forEach(([id, count]) => {
                    if (count <= 0) return;
                    const v = PIZZA_VARIANTS[id];
                    lines.push(`\n${v.emoji} ${v.name} × ${count}`);
                    v.ingredients.forEach(ing => {
                        const total = ing.g * count;
                        const totalStr = ing.unit === 'hojas' ? `${Math.round(total)} hojas` : `${round(total, 1)}g`;
                        lines.push(`  ${ing.name}: ${round(ing.g, 1)}${ing.unit === 'hojas' ? ' hojas' : 'g'}/pizza × ${count} = ${totalStr}`);
                    });
                });

                lines.push('\n═══════════════════════════════════════');
                lines.push('LISTA DE LA COMPRA AGREGADA');
                lines.push('═══════════════════════════════════════');
                TOPPING_ORDER.forEach(id => {
                    const data = shoppingList[id];
                    if (!data || data.total <= 0) return;
                    const info = TOPPING_PURCHASE_INFO[id];
                    let line;
                    if (data.unit === 'hojas') {
                        line = `${info.label}: ~${Math.round(data.total)} hojas`;
                    } else if (id === 'fiordilatte') {
                        const buy = data.total / TOPPING_PURCHASE_INFO.fiordilatte.shrink;
                        line = `${info.label}: ${Math.round(data.total)}g escurrida → comprar ~${Math.round(buy)}g sin escurrir`;
                    } else {
                        line = `${info.label}: ${round(data.total, 1)}g`;
                    }
                    if (info.note) line += `  (${info.note})`;
                    lines.push('• ' + line);
                });

                return lines.join('\n');
            };

            const copyAll = () => {
                navigator.clipboard?.writeText(buildText()).then(() => showToast('Receta copiada ✓'));
            };

            const downloadAll = () => {
                const blob = new Blob([buildText()], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pizzas-${totalPizzas}u.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Lista descargada ✓');
            };

            return (
                <div className="animate-in">
                    {view === 'assign' && (
                    <>
                    {/* Header with progress */}
                    <div style={{
                        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                        marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem',
                        padding: '0.75rem 0.95rem',
                        background: isOverLimit ? 'var(--danger-soft)' : isAtLimit ? 'var(--success-soft)' : 'var(--surface-2)',
                        border: `1px solid ${isOverLimit ? 'var(--danger)' : isAtLimit ? 'var(--success)' : 'var(--border-soft)'}`,
                        borderRadius: 'var(--radius-sm)',
                        transition: 'all 0.2s',
                    }}>
                        <div>
                            <div style={{fontSize: '0.78rem', color: 'var(--text-soft)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600, marginBottom: '0.2rem'}}>
                                Asignadas
                            </div>
                            <div style={{fontFamily: 'var(--font-label)', fontSize: '1.35rem', fontWeight: 500, color: 'var(--text)', lineHeight: 1, fontVariantNumeric: 'tabular-nums'}}>
                                {totalPizzas} <span style={{color: 'var(--text-muted)', fontSize: '1rem'}}>/ {maxPizzas} bolas</span>
                            </div>
                            <div style={{fontSize: '0.78rem', marginTop: '0.25rem', color: isOverLimit ? 'var(--danger)' : remaining === 0 ? 'var(--success)' : 'var(--text-soft)', fontWeight: 500}}>
                                {isOverLimit ? `⚠️ Te pasas por ${totalPizzas - maxPizzas}` : remaining === 0 ? '✓ Todo asignado' : `Quedan ${remaining} por asignar`}
                            </div>
                        </div>
                        <div style={{display: 'flex', gap: '0.4rem', flexWrap: 'wrap'}}>
                            <button className="icon-btn" onClick={autoDistribute} title="Repartir automáticamente según mi sugerencia">
                                ✨ Auto
                            </button>
                            <button className="icon-btn" onClick={resetCounts}>↻ Reset</button>
                            <button className="icon-btn" onClick={copyAll} disabled={totalPizzas === 0}><Icon name="copy" size={14}/></button>
                            <button className="icon-btn" onClick={downloadAll} disabled={totalPizzas === 0}><Icon name="download" size={14}/></button>
                        </div>
                    </div>

                    {/* Hint when at zero */}
                    {totalPizzas === 0 && (
                        <div className="info-note" style={{marginBottom: '1rem'}}>
                            💡 Pulsa <strong>✨ Auto</strong> para que reparta las {maxPizzas} bolas automáticamente con mi sugerencia, o configura tú mismo cuántas de cada.
                        </div>
                    )}

                    {/* Variant selector */}
                    <div style={{fontFamily: 'var(--font-label)', fontSize: '0.95rem', fontWeight: 500, color: 'var(--accent)', marginBottom: '0.6rem'}}>
                        Elige cuántas de cada
                    </div>
                    <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '1.25rem'}}>
                        {Object.entries(PIZZA_VARIANTS).map(([id, v]) => {
                            const count = counts[id] || 0;
                            const canIncrease = !isAtLimit;
                            return (
                                <div key={id} style={{
                                    display: 'grid',
                                    gridTemplateColumns: '1fr auto',
                                    gap: '0.7rem',
                                    alignItems: 'center',
                                    padding: '0.7rem 0.85rem',
                                    background: count > 0 ? 'var(--primary-soft)' : 'var(--surface-2)',
                                    border: `1px solid ${count > 0 ? 'var(--primary)' : 'var(--border-soft)'}`,
                                    borderRadius: 'var(--radius-sm)',
                                    transition: 'all 0.15s',
                                }}>
                                    <div style={{minWidth: 0}}>
                                        <div style={{fontWeight: 600, fontSize: '0.92rem', color: 'var(--text)', marginBottom: '0.15rem'}}>
                                            {v.emoji} {v.name}
                                        </div>
                                        <div style={{fontSize: '0.76rem', color: 'var(--text-soft)', lineHeight: 1.4}}>
                                            {v.desc}
                                        </div>
                                    </div>
                                    <div style={{display: 'flex', alignItems: 'center', gap: '0.35rem', flexShrink: 0}}>

        const FocacciaToppings = ({ counts, setCounts, maxTrays, view = 'assign', showToast }) => {
            const totalAssigned = Object.values(counts).reduce((s, n) => s + n, 0);
            const remaining = Math.max(0, maxTrays - totalAssigned);
            const isAtLimit = totalAssigned >= maxTrays;
            const isOverLimit = totalAssigned > maxTrays;

            const shoppingList = useMemo(() => {
                const totals = {};
                Object.entries(counts).forEach(([id, count]) => {
                    if (count <= 0) return;
                    FOCACCIA_VARIANTS[id].ingredients.forEach(ing => {
                        if (!totals[ing.id]) totals[ing.id] = { total: 0, unit: ing.unit };
                        totals[ing.id].total += ing.g * count;
                    });
                });
                return totals;
            }, [counts]);

            const setCount = (id, delta) => {
                setCounts(prev => {
                    const current = Object.values(prev).reduce((s, n) => s + n, 0);
                    if (delta > 0 && current >= maxTrays) {
                        showToast(`Límite alcanzado: ${maxTrays} ${maxTrays === 1 ? 'bandeja' : 'bandejas'}`);
                        return prev;
                    }
                    return { ...prev, [id]: Math.max(0, (prev[id] || 0) + delta) };
                });
            };

            const resetCounts = () => {
                const zeroed = {};
                Object.keys(FOCACCIA_VARIANTS).forEach(k => zeroed[k] = 0);
                setCounts(zeroed);
                showToast('Reparto reiniciado');

            const buildText = () => {
                const lines = [];
                lines.push(`FOCACCIA — ${totalAssigned} ${totalAssigned === 1 ? 'bandeja' : 'bandejas'}`);
