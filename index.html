                                    return (
                                        <div className="timeline">
                                            <div className="timeline-head">
                                                <span>De la mezcla al horno</span>
                                                <span className="timeline-total">{formatHours(total)}</span>
                                            </div>
                                            <div className="timeline-track">
                                                {legs.map((l, idx) => {
                                                    const share = grow[idx] / growSum;
                                                    return (
                                                        <div key={l.key} className={`leg ${l.cls}`}
                                                            style={{flexGrow: grow[idx]}}
                                                            title={`${l.name} · ${formatHours(l.h)} · ${l.t}°C`}>
                                                            {share > 0.19 && <span className="leg-name">{l.name}</span>}
                                                            <span className="leg-h">{formatHours(l.h)}</span>
                                                            {share > 0.19 && <span className="leg-t">{l.t}°C</span>}
                                                        </div>
                                                    );
                                                })}
                                                <div className="leg leg-bake" title="Horno">🔥</div>
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* Tipo de horno (solo pizza) */}
                                {doughType === 'pizza' && (
                                    <div className="section">
                                        <div className="section-label"><span className="step-num">2</span> Tu horno</div>
                                        <div className="pan-grid">
                                            {Object.entries(PIZZA_OVENS).map(([k, o]) => (
                                                <button key={k}
                                                    className={`pan-mold-btn ${pizzaOven === k ? 'active' : ''}`}
                                                    onClick={() => setPizzaOven(k)}>
                                                    <span style={{fontWeight: 600}}>{o.emoji} {o.label}</span>
                                                    <span className="ms">{o.sub}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <div style={{fontSize: '0.78rem', color: 'var(--text-soft)', fontStyle: 'italic', marginTop: '0.5rem'}}>
                                            {PIZZA_OVENS[pizzaOven].targetTemp} · cocción en {PIZZA_OVENS[pizzaOven].cookTime}. El plan de horneado se adapta a tu equipo.
                                        </div>
                                    </div>
                                )}

                                {/* Cantidad e ingredientes */}
                                <div className="section">
                                    <div className="section-label"><span className="step-num">{doughType === 'pizza' ? 3 : 2}</span> Cantidad e ingredientes</div>
                                    <div className="slider-group">
                                        {doughType === 'pan' ? (
                                            <Slider label="Harina total" icon="🌾" value={flour} onChange={setFlour}
                                                min="100" max="2000" step="50" unit="g" />
                                        ) : (
                                            <Slider label="Número de bolas" icon="🍕" value={pizzaBalls} onChange={setPizzaBalls}
                                                min="1" max="20" step="1" unit="bolas"
                                                hint="Cada bola → 260g de masa lista" />
                                        )}
                                        <Slider label="Hidratación final" icon="💧" value={hydration} onChange={setHydration}
                                            min={50} max={100}
                                            step="1" unit="%"
                                            tip="Porcentaje de agua sobre el peso de la harina total. A más hidratación, miga más abierta y alveolada, pero más difícil de manejar."
                                            hint={hydration < 65 ? 'Miga densa, fácil de manipular'
                                                : hydration < 75 ? 'Equilibrio clásico, buen alveolado'
                                                : hydration < 85 ? 'Miga abierta, requiere folds'
                                                : 'Hidratación alta, técnica avanzada'}
                                            hidden={doughType === 'pizza'} />
                                        <Slider label="Sal" icon="🧂" value={saltPercent} onChange={setSaltPercent}
                                            min="1" max="3.5" step="0.1" unit="%"
                                            tip="Sobre el peso de la harina total. La sal controla la fermentación y aporta sabor. Menos de 1.5% acelera demasiado; más de 3% inhibe la levadura."
                                            hint="Estándar: 1.8-2.2% · pizza napolitana: 2.5-3%"
                                            hidden={doughType === 'pizza'} />

                                        {/* Malta diastásica */}
                                        <div>
                                            <div className="toggle-row">
                                                <span className="toggle-label">🌾 Malta diastásica (enzimática)</span>
                                                <label className="toggle-switch">
                                                    <input type="checkbox" checked={useMalt}
                                                        onChange={e => setUseMalt(e.target.checked)} />
                                                    <span className="toggle-slider"></span>
                                                </label>
                                            </div>
                                            {useMalt && (() => {
                                                const fermH = (useColdProof ? calc.coldH + calc.ambientH : totalTime) + (prefermentType !== 'none' ? prefermentTime : 0);
                                                const adv = maltAdvice(doughType, pizzaOven, fermH);
                                                const grams = calc.currentFlour * maltPercent / 100;
                                                const low = maltPercent < adv.lo;
                                                const high = maltPercent > adv.hi;
                                                return (
                                                    <div className="stage-block stage-pref" style={{marginTop: '0.9rem'}}>
                                                        <div className="stage-tag">Dosis</div>
                                                        <Slider label="Malta sobre la harina" icon="🌾" value={maltPercent}
                                                            onChange={setMaltPercent} min="0.1" max="1" step="0.05" unit="%"
                                                            tip="Porcentaje sobre la harina total. Las amilasas rompen el almidón en azúcares: alimentan la levadura y dan color de corteza. Pasarse deja la masa pegajosa y la miga gomosa."
                                                            hint={`${round(grams, 1)}g de malta · recomendado ${adv.lo}-${adv.hi}% para tu caso`} />
                                                        <div style={{fontSize: '0.79rem', color: 'var(--text-soft)', lineHeight: 1.55}}>
                                                            {adv.why}
                                                        </div>
                                                        {high && (
                                                            <div className="warn-box">
                                                                <Icon name="alert" />
                                                                <span>Por encima de <strong>{adv.hi}%</strong> para tu combinación. El exceso de amilasas degrada demasiado el almidón: masa húmeda y pegajosa, y miga densa y gomosa.</span>
                                                            </div>
                                                        )}
                                                        {!high && low && adv.lo > 0 && (
                                                            <div style={{fontSize: '0.79rem', color: 'var(--text-muted)'}}>
                                                                Por debajo del rango: notarás poco efecto en el color.
                                                            </div>
                                                        )}
                                                        {fermH >= 48 && maltPercent > 0.3 && (
                                                            <div className="warn-box">
                                                                <Icon name="alert" />
                                                                <span>Con {formatHours(fermH)} de fermentación las enzimas tienen mucho tiempo para trabajar. Baja la dosis o acorta el frío.</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                        {doughType === 'pizza' && (() => {
                                            const f = PIZZA_FLOURS[pizzaFlour];
                                            const below = pizzaHyd < f.hydLo;
                                            const above = pizzaHyd > f.hydHi;
                                            const equivPizzeria = equivalentHydration(pizzaFlour, 'pizzeria', pizzaHyd);
                                            return (
                                                <div>
                                                    <div style={{fontSize: '0.78rem', color: 'var(--text-soft)', textTransform: 'uppercase', letterSpacing: '0.09em', fontWeight: 600, fontFamily: 'var(--font-label)', marginBottom: '0.5rem'}}>
                                                        Harina
                                                    </div>
                                                    <div className="pan-grid">
                                                        {Object.entries(PIZZA_FLOURS).map(([k, fl]) => (
                                                            <button key={k}
                                                                className={`pan-mold-btn ${pizzaFlour === k ? 'active' : ''}`}
                                                                onClick={() => { setPizzaFlour(k); setPizzaHyd(PIZZA_FLOURS[k].hydDefault); }}>
                                                                <span style={{fontWeight: 600}}>{fl.label}</span>
                                                                <span className="ms">{fl.sub}</span>
                                                            </button>
                                                        ))}
                                                    </div>

                                                    <div className="stage-block stage-final" style={{marginTop: '0.9rem'}}>
                                                        <div className="stage-tag">Hidratación</div>

                                                            onChange={setPizzaHyd} min="55" max="85" step="1" unit="%"

                                                            hint={`Recomendado ${f.hydLo}-${f.hydHi}% · equivale a ${round(equivPizzeria, 1)}% con Pizzeria`} />
                                                        <div style={{fontSize: '0.79rem', color: 'var(--text-soft)', lineHeight: 1.55}}>
                                                            {f.note}
                                                        </div>
                                                        {below && (
                                                            <div className="warn-box">
                                                                <Icon name="alert" />
                                                                <span>Por debajo de {f.hydLo}% esta harina queda tensa: el velo sale grueso y el disco se resiste al estirarlo. Sube de 2 en 2%.</span>
                                                            </div>
                                                        )}
                                                        {above && (
                                                            <div className="warn-box">
                                                                <Icon name="alert" />
                                                                <span>Por encima de {f.hydHi}% la masa se vuelve pegajosa y frágil. Sube la hidratación poco a poco en vez de dar el salto de golpe.</span>
                                                            </div>
                                                        )}
                                                        {pizzaHyd >= 68 && (
                                                            <div className="info-note">
                                                                <strong>Bassinage:</strong> reserva el último 3-5% del agua y añádelo en hilo fino al final del amasado, con la masa ya formada. Absorbe mucho mejor que metiéndola toda desde el principio, y es donde vas a ver aparecer el velo.
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="info-note" style={{marginTop: '0.9rem'}}>
                                                        <strong>Sal fija en {PIZZA_SALT}%</strong> (estándar AVPN). Fermentación recomendada para esta harina: {f.fermLo}-{f.fermHi}h.
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>

                                {/* Prefermento */}
                                <div className="section">
                                    <div className="section-label"><span className="step-num">{doughType === 'pizza' ? 4 : 3}</span> Prefermento (opcional)</div>
                                    <div className="pref-grid">
                                        {Object.entries(PREFERMENTS).map(([key, p]) => (
                                            <button key={key}
                                                className={`pref-pill ${prefermentType === key ? 'active' : ''}`}
                                                onClick={() => setPrefermentType(key)}>
                                                <span className="e">{p.emoji}</span>
                                                <span>{p.name}</span>
                                                {p.hydration && <span className="h">{p.hydration}%</span>}
                                            </button>
                                        ))}
                                    </div>
                                    <PrefermentInfo type={prefermentType} />
                                    {prefermentType !== 'none' && (
                                        <div className="stage-block stage-pref">
                                            <div className="stage-tag">Solo el prefermento</div>
                                            <Slider label="% de la harina que va al prefermento" icon="↳" value={prefermentFlourPercent}
                                                onChange={setPrefermentFlourPercent} min="20" max="50" step="5" unit="%"
                                                tip="Qué parte del total de harina se usa para hacer el prefermento. El resto se reserva para la masa final."
                                                hint={`${Math.round(calc.prefFlour)}g al prefermento · ${Math.round(calc.finalFlour)}g a la masa final`} />
                                            <Slider label="Tiempo de levado del prefermento" icon="⏰" value={prefermentTime}
                                                onChange={setPrefermentTime} min="4" max="24" step="1" unit="hrs" />
                                            <Slider label="Temperatura del prefermento" icon="🌡️" value={prefermentTemp}
                                                onChange={setPrefermentTemp} min="4" max="30" step="1" unit="°C" />
                                        </div>
                                    )}
                                </div>

                                {/* Fermentación */}
                                <div className="section">
                                    <div className="section-label"><span className="step-num">{doughType === 'pizza' ? 5 : 4}</span> Fermentación de la masa final</div>
                                    <div className="stage-block stage-final">
                                        <div className="stage-tag">Solo la masa final</div>
                                        <div className="toggle-row" style={{marginBottom: '1rem'}}>
                                            <span className="toggle-label">❄️ Levado en frío (nevera)</span>
                                            <label className="toggle-switch">
                                                <input type="checkbox" checked={useColdProof}
                                                    onChange={e => setUseColdProof(e.target.checked)} />
                                                <span className="toggle-slider"></span>
                                            </label>
                                        </div>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                                            {useColdProof && (
                                                <Slider label="Tiempo en frío" icon="❄️" value={coldProofTime}
                                                    onChange={setColdProofTime} min="8" max="72" step="1" unit="hrs" />
                                            )}
                                            <Slider label="Tiempo de levado de la masa final" icon="⏰" value={totalTime}
                                                onChange={setTotalTime} min="1" max="12" step="0.5" unit="hrs"
                                                disabled={useColdProof}
                                                hint={useColdProof ? 'El bulk se calcula automáticamente al activar levado en frío' : ''} />
                                            <Slider label="Temperatura de la masa final" icon="🌡️" value={temperature} onChange={setTemperature}
                                                min="4" max="32" step="1" unit="°C"
                                                tip="Q10 es la regla biológica que dice que la actividad enzimática se duplica cada 10°C. Para la levadura: a 32°C fermenta el doble que a 22°C."
                                                hint={`Q10≈2: ${temperature < 22 ? 'fermenta más lento' : temperature > 22 ? 'fermenta más rápido' : 'velocidad de referencia'} que a 22°C`} />
                                        </div>
                                    </div>
                                </div>
                                {doughType === 'pizza' && (
                                    <div className="section">
                                        <div className="section-label"><span className="step-num">6</span> Congelar las bolas</div>
                                        <div className="toggle-row">
                                            <span className="toggle-label">🧊 Voy a congelar las bolas</span>
                                            <label className="toggle-switch">
                                                <input type="checkbox" checked={pizzaFreeze}
                                                    onChange={e => setPizzaFreeze(e.target.checked)} />
                                                <span className="toggle-slider"></span>
                                            </label>
                                        </div>
                                        {pizzaFreeze && (
                                            <div className="stage-block stage-pref" style={{marginTop: '0.9rem'}}>
                                                <div className="stage-tag">Cómo descongelar</div>
                                                <div className="pan-grid" style={{marginBottom: 0}}>
                                                    <button className={`pan-mold-btn ${pizzaThawRoute === 'nevera' ? 'active' : ''}`}
                                                        onClick={() => setPizzaThawRoute('nevera')}>
                                                        <span style={{fontWeight: 600}}>❄️ Nevera</span>
                                                        <span className="ms">Lento · recomendado</span>
                                                    </button>
                                                    <button className={`pan-mold-btn ${pizzaThawRoute === 'ambiente' ? 'active' : ''}`}
                                                        onClick={() => setPizzaThawRoute('ambiente')}>
                                                        <span style={{fontWeight: 600}}>☀️ Encimera</span>
                                                        <span className="ms">Rápido · mismo día</span>
                                                    </button>
                                                </div>
                                                <div style={{fontSize: '0.78rem', color: 'var(--text-soft)', marginTop: '0.6rem', lineHeight: 1.5}}>
                                                    A {temperature}°C necesitas <strong style={{color: 'var(--text)'}}>{formatHours(thawPlan(pizzaThawRoute, temperature).total)}</strong> desde que las sacas hasta que puedes estirarlas.
                                                </div>
                                                {thawPlan(pizzaThawRoute, temperature).warn && (
                                                    <div className="warn-box" style={{marginTop: '0.6rem'}}>
                                                        <Icon name="alert" />
                                                        <span>{thawPlan(pizzaThawRoute, temperature).warn}</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                </>)}
                            </div>

                            {/* ─── RIGHT: RESULTS ─── */}
                            <div className="card">
                                {doughType === 'panettone' ? (
                                    <PanettoneResults
                                        mold={panMold}
                                        units={panUnits}
                                        liquidStarter={panLiquidStarter}
                                        bakeDay={panBakeDay}
                                        checks={panChecks}
                                        onToggleCheck={togglePanCheck}
                                        onResetChecks={() => { setPanChecks({}); showToast('Checklist reiniciado'); }}
                                        showToast={showToast}
                                    />
                                ) : doughType === 'focaccia' ? (
                                    <FocacciaResults
                                        starterType={focStarter}
                                        trays={focTrays}
                                        ambientTemp={focAmbient}
                                        coldHours={focColdHours}
                                        bakeTime={focBakeTime}
                                        setBakeTime={setFocBakeTime}
                                        checks={focChecks}
                                        onToggleCheck={toggleFocCheck}
                                        onResetChecks={() => { setFocChecks({}); showToast('Checklist reiniciado'); }}
                                        toppings={focToppings}
                                        setToppings={setFocToppings}
                                        showToast={showToast}
                                    />
                                ) : doughType === 'gofres' ? (
                                    <GofresResults
                                        units={gofUnits}
                                        coldHours={gofColdHours}
                                        readyTime={gofReadyTime}
                                        setReadyTime={setGofReadyTime}
                                        checks={gofChecks}
                                        onToggleCheck={toggleGofCheck}
                                        onResetChecks={() => { setGofChecks({}); showToast('Checklist reiniciado'); }}
                                        showToast={showToast}
                                    />
                                ) : (
                                <>
                                <div className="tabs">
                                    <button className={`tab ${activeTab === 'recipe' ? 'active' : ''}`} onClick={() => setActiveTab('recipe')}>📋 Receta</button>
                                    <button className={`tab ${activeTab === 'schedule' ? 'active' : ''}`} onClick={() => setActiveTab('schedule')}>⏱ Cronograma</button>
                                    <button className={`tab ${activeTab === 'baking' ? 'active' : ''}`} onClick={() => setActiveTab('baking')}>🔥 Horneado</button>
                                    {doughType === 'pizza' && (
                                        <>
                                            <button className={`tab ${activeTab === 'toppings' ? 'active' : ''}`} onClick={() => setActiveTab('toppings')}>🍕 Toppings</button>
                                            <button className={`tab ${activeTab === 'compra' ? 'active' : ''}`} onClick={() => setActiveTab('compra')}>🛒 Compra</button>
                                        </>
                                    )}
                                </div>

                                {quality.issues.length > 0 && (
                                    <div className="quality-bar">
                                        <span style={{fontWeight: 600}}>Calidad:</span>
                                        <div className="quality-dots">
                                            {[1,2,3,4,5].map(n => (
                                                <span key={n} className={`qd ${n <= quality.score ? (quality.score >= 4 ? 'on' : quality.score >= 3 ? 'warn' : 'bad') : ''}`}></span>
                                            ))}
                                        </div>
                                        <span style={{color: 'var(--text-muted)', fontSize: '0.76rem'}}>
                                            {quality.issues.length} ajuste{quality.issues.length !== 1 ? 's' : ''} sugerido{quality.issues.length !== 1 ? 's' : ''}
                                        </span>
                                    </div>
                                )}

                                {quality.issues.filter(i => i.level === 'warn').slice(0, 2).map((iss, i) => (
                                    <div key={i} className="warn-box">
                                        <Icon name="alert" /> <span>{iss.msg}</span>
                                    </div>
                                ))}

                                {/* RECIPE TAB */}
                                {activeTab === 'recipe' && (
                                    <div className="animate-in">
                                        {prefermentType !== 'none' && (
                                            <div className="pref-box">
                                                <div className="pref-box-header">
                                                    <span>🌿 {PREFERMENTS[prefermentType].name}</span>
                                                    <span style={{opacity: 0.85}}>{prefermentTime}h · {prefermentTemp}°C</span>
                                                </div>
                                                <div className="pref-box-body">
                                                    <div className="ing-grid" style={{marginBottom: 0}}>
                                                        <div className="ing-card"><div className="l">Harina</div><div className="v">{round(calc.prefFlour)}</div><div className="u">gramos</div></div>
                                                        <div className="ing-card"><div className="l">Agua ({PREFERMENTS[prefermentType].hydration}%)</div><div className="v">{round(calc.prefWater)}</div><div className="u">gramos</div></div>
                                                        {PREFERMENTS[prefermentType].noYeast ? (
                                                            <div className="ing-card"><div className="l">Masa madre</div><div className="v">{round(calc.prefFlour * 0.4)}</div><div className="u">g (aprox.)</div></div>
                                                        ) : (
                                                            <div className="ing-card"><div className="l">Levadura seca</div><div className="v">{round(calc.prefYeast, 2)}</div><div className="u">gramos</div></div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <div style={{fontFamily: 'var(--font-label)', fontSize: '0.95rem', fontWeight: 500, marginBottom: '0.6rem', color: 'var(--accent)'}}>
                                            {prefermentType !== 'none' ? '🍞 Masa final (resto)' : '🍞 Masa'}
                                        </div>
                                        <div className="ing-grid">
                                            <div className="ing-card"><div className="l">Harina</div><div className="v">{round(calc.finalFlour)}</div><div className="u">gramos</div></div>
                                            <div className="ing-card"><div className="l">Agua</div><div className="v">{round(calc.finalWater)}</div><div className="u">gramos</div></div>
                                            <div className="ing-card"><div className="l">Sal ({saltPercent}%)</div><div className="v">{round(calc.saltGrams, 1)}</div><div className="u">gramos</div></div>
                                            {useMalt && (
                                                <div className="ing-card"><div className="l">Malta diastásica ({maltPercent}%)</div><div className="v">{round(calc.currentFlour * maltPercent / 100, 1)}</div><div className="u">gramos</div></div>
                                            )}
                                        </div>

                                        {useMalt && (
                                            <div className="info-note" style={{marginTop: '0.75rem'}}>
                                                <strong>Cómo incorporarla:</strong> mézclala en seco con la harina antes de añadir el agua. Nunca la disuelvas en el agua junto a la levadura.
                                                <br/><strong>Ojo al ritmo:</strong> al liberar azúcares, la fermentación se acelera. Guíate por el volumen de la masa más que por el reloj — puede ir entre un 10 y un 15% más rápido de lo que marca el cronograma.
                                            </div>
                                        )}

                                        {calc.yeastGrams > 0 && (
                                            <div className="yeast-card">
                                                <div className="l">⚖️ Levadura seca instantánea</div>
                                                <div className="v">{round(calc.yeastGrams, 2)}g</div>
                                                <div className="u">{round(calc.yeastPercent, 2)}% sobre harina · ×3 si fresca</div>
                                                <div className="tiny">Si solo tienes levadura fresca prensada, multiplica por 3 (≈{round(calc.yeastGrams * 3, 1)}g)</div>
                                            </div>
                                        )}

                                        <div className="info-note">
                                            <strong>Total de la masa:</strong> {round(calc.totalDough)}g
                                            {doughType === 'pizza' && ` · ${pizzaBalls} bolas de ~${DOUGHBALL_WEIGHT}g`}
                                            <br/><strong>Hidratación:</strong> {calc.effHydration}% · <strong>Sal:</strong> {calc.effSalt}% del peso de harina
                                        </div>

                                        {/* Visual indicators */}
                                        <div style={{marginTop: '1rem'}}>
                                            <div style={{fontFamily: 'var(--font-label)', fontSize: '0.95rem', fontWeight: 500, marginBottom: '0.6rem', color: 'var(--accent)'}}>
                                                👁️ Cómo saber si está lista
                                            </div>
                                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '0.5rem'}}>
                                                <div style={{background: 'var(--surface-2)', padding: '0.7rem', borderRadius: 'var(--radius-sm)', fontSize: '0.78rem', lineHeight: 1.45}}>
                                                    <strong style={{color: 'var(--accent)'}}>🥣 Bulk</strong>
                                                    <div style={{color: 'var(--text-soft)', marginTop: '0.2rem'}}>
                                                        +60-75% volumen, jiggly al mover, burbujas en superficie y laterales del bote.
                                                    </div>
                                                </div>
                                                <div style={{background: 'var(--surface-2)', padding: '0.7rem', borderRadius: 'var(--radius-sm)', fontSize: '0.78rem', lineHeight: 1.45}}>
                                                    <strong style={{color: 'var(--accent)'}}>🫓 Levado final</strong>
                                                    <div style={{color: 'var(--text-soft)', marginTop: '0.2rem'}}>
                                                        Poke test: presiona y la marca debe rebotar lentamente y dejar leve hueco.
                                                    </div>
                                                </div>
                                                {doughType === 'pan' && (
                                                    <div style={{background: 'var(--surface-2)', padding: '0.7rem', borderRadius: 'var(--radius-sm)', fontSize: '0.78rem', lineHeight: 1.45}}>
                                                        <strong style={{color: 'var(--accent)'}}>🍞 Horneado</strong>
                                                        <div style={{color: 'var(--text-soft)', marginTop: '0.2rem'}}>
                                                            Caoba profundo, base hueca al golpear, 96-99°C interior.
                                                        </div>
                                                    </div>
                                                )}
                                                {doughType === 'pizza' && (
                                                    <div style={{background: 'var(--surface-2)', padding: '0.7rem', borderRadius: 'var(--radius-sm)', fontSize: '0.78rem', lineHeight: 1.45}}>
                                                        <strong style={{color: 'var(--accent)'}}>🍕 Pizza</strong>
                                                        <div style={{color: 'var(--text-soft)', marginTop: '0.2rem'}}>
                                                            Cornicione hinchado con leoparding (manchitas oscuras) y queso fundido.
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* SCHEDULE TAB */}
                                {activeTab === 'schedule' && (
                                    <div className="animate-in">
                                        <div className="schedule-input">
                                            <label>🔥 ¿A qué hora quieres hornear?</label>
                                            <input type="time" value={bakeTime} onChange={e => setBakeTime(e.target.value)} />
                                        </div>
                                        <div className="schedule">
                                            {schedule.map((ev, i) => (
                                                <div key={i} className={`schedule-row ${ev.kind}`}>
                                                    <div className="schedule-time">
                                                        {formatClock(ev.time)}
                                                        <div style={{fontSize: '0.65rem', color: 'var(--text-muted)', fontWeight: 400, fontFamily: 'var(--font-ui)'}}>
                                                            {formatDay(ev.time, schedule[schedule.length-1].time)}
                                                        </div>
                                                    </div>
                                                    <div className="schedule-step">
                                                        <div className="name">
                                                            <span className="ic">{ev.icon}</span>
                                                            {ev.name}
                                                        </div>
                                                        <div className="desc">{ev.desc}</div>
                                                    </div>
                                                    <div className="schedule-duration">
                                                        {ev.dur ? formatHours(ev.dur) : ''}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="info-note">
                                            <strong>Cronograma calculado hacia atrás</strong> desde tu hora de horneado.
                                            Ajusta la hora arriba para ver cuándo empezar.
                                        </div>
                                    </div>
                                )}

                                {/* BAKING TAB */}
                                {activeTab === 'baking' && (
                                    <div className="animate-in">
                                        {doughType === 'pizza' && pizzaFreeze && (() => {
                                            const plan = thawPlan(pizzaThawRoute, temperature);
                                            return (
                                                <div className="bake-card" style={{marginBottom: '1rem'}}>
                                                    <div className="bake-header">🧊 Del congelador al horno</div>
                                                    <div className="bake-preheat">
                                                        <span>Tiempo total desde que las sacas</span>
                                                        <span><span className="pt">{formatHours(plan.total)}</span> · a {temperature}°C</span>
                                                    </div>
                                                    {plan.steps.map((st, i) => (
                                                        <div className="bake-phase" key={i}>
                                                            <div className="bake-phase-title">{st.icon} {st.name}</div>
                                                            <div className="bake-stats">
                                                                <div className="bake-stat"><div className="v">{formatHours(st.h)}</div><div className="l">Duración</div></div>
                                                                <div className="bake-stat"><div className="v">{st.temp}</div><div className="l">Temp.</div></div>
                                                            </div>
                                                            <div className="bake-action">{st.desc}</div>
                                                        </div>
                                                    ))}
                                                    {plan.warn && <div className="bake-note">⚠️ {plan.warn}</div>}
                                                    <div className="bake-note">🧪 La congelación se lleva por delante parte de la levadura. Si notas que las bolas suben poco, sube la levadura un 15-20% en la siguiente tanda que vayas a congelar.</div>
                                                    <div className="bake-note">👐 Estira solo cuando la bola ceda al tacto y no esté fría por dentro. En frío el gluten no se relaja y se te romperá el disco.</div>
                                                </div>
                                            );
                                        })()}
                                        <BakingPlan plan={calc.bakingPlan} />
                                        <div className="info-note">
                                            <strong>Indicador de cocción:</strong> {doughType === 'pizza'
                                                ? 'cornicione bien dorado y con leoparding (manchas oscuras).'
                                                : 'corteza color caoba profundo, base que suena hueca al golpear, temperatura interna 96-99°C.'}
                                        </div>
                                    </div>
                                )}

                                {/* TOPPINGS TAB (pizza only) */}
                                {activeTab === 'toppings' && doughType === 'pizza' && (
                                    <PizzaToppings
                                        counts={pizzaToppingCounts}
                                        setCounts={setPizzaToppingCounts}
                                        maxPizzas={pizzaBalls}
                                        view="assign"
                                        showToast={showToast}
                                    />
                                )}

                                {activeTab === 'compra' && doughType === 'pizza' && (
                                    <PizzaToppings
                                        counts={pizzaToppingCounts}
                                        setCounts={setPizzaToppingCounts}
                                        maxPizzas={pizzaBalls}
                                        view="shopping"
                                        showToast={showToast}
                                    />
                                )}

                                <div className="info-note" style={{marginTop: '1rem'}}>
                                    <strong>Nota:</strong> Esta calculadora es una guía. La fuerza real de la harina, la actividad de tu levadura y la humedad ambiente pueden variar los tiempos. Aprende a leer la masa: doblada, jiggly, llena de burbujas en superficie y al menos al 70% de su volumen inicial.
                                </div>
                                </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* TOAST */}
                    {toast && <div className="toast"><Icon name="check" size={16}/> {toast}</div>}
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
        // Load Babel, then manually transform and run the app source.
        // This guarantees the JSX is only processed AFTER Babel is fully loaded,
        // avoiding the silent-skip problem on slow connections.
        (function() {
            function showError(msg) {
                var root = document.getElementById('root');
                if (root) {
                    root.innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#9e3333;max-width:600px;margin:0 auto">' +
                        '<h2>No se pudo cargar la aplicación</h2><p>' + msg + '</p>' +
                        '<p>Recarga la página. Si persiste, comprueba tu conexión.</p></div>';
                }
            }

            var babel = document.createElement('script');
            babel.src = 'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js';
            babel.onload = function() {
                try {
                    var source = document.getElementById('app-source').textContent;
                    var transformed = Babel.transform(source, {
                        presets: [['react', { runtime: 'classic' }]]
                    }).code;
                    var run = document.createElement('script');
                    run.textContent = transformed;
                    document.body.appendChild(run);
                } catch (e) {
                    showError('Error al procesar la aplicación: ' + e.message);
                }
            };
            babel.onerror = function() {
                showError('No se pudo cargar Babel desde el CDN.');
            };
            document.head.appendChild(babel);
        })();
    </script>

    <div id="cookie-consent-banner">
        <p>
            Uso cookies de Google Analytics para ver estadísticas anónimas. Como es una web personal, no uso estos datos para publicidad.
            Más en mi <a href="/politica-de-privacidad">Política de Privacidad</a>.
        </p>
        <div class="cookie-btns">
            <button id="btn-reject-cookies" class="cookie-btn btn-reject">Rechazar</button>
            <button id="btn-accept-cookies" class="cookie-btn btn-accept">Aceptar</button>
        </div>
    </div>

    <script>
        const GA_MEASUREMENT_ID = 'G-EVTE774402';
        function loadGoogleAnalytics() {
            var s = document.createElement('script');
            s.src = `https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}`;
            s.async = true;
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', GA_MEASUREMENT_ID);
        }
        window.addEventListener('load', function() {
            const consent = localStorage.getItem('userConsent');
            if (consent === 'accepted') loadGoogleAnalytics();
            else if (!consent) document.getElementById('cookie-consent-banner').style.display = 'block';
        });
        document.getElementById('btn-accept-cookies').addEventListener('click', function() {
            localStorage.setItem('userConsent', 'accepted');
            document.getElementById('cookie-consent-banner').style.display = 'none';
            loadGoogleAnalytics();
        });
        document.getElementById('btn-reject-cookies').addEventListener('click', function() {
            localStorage.setItem('userConsent', 'rejected');
            document.getElementById('cookie-consent-banner').style.display = 'none';
        });
    </script>
</body>
</html>
